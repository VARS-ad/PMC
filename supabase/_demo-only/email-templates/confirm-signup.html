<!--
  VARS — Confirm signup email (v2 — matches the login page calm style)
  Paste the entire body below into Supabase: Auth → Email Templates → Confirm signup.
  Suggested subject: "Confirm your VARS demo account"
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4EEE4;padding:48px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#131F23;">
  <tr>
    <td align="center">
      <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;width:100%;background:#FFFFFF;border-radius:14px;border:1px solid #E6EAE9;">

        <!-- Logo lockup — same as the login card: icon + wordmark, centered -->
        <tr>
          <td align="center" style="padding:42px 36px 4px 36px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td style="vertical-align:middle;padding-right:14px;">
                <svg width="46" height="46" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="VARS">
                  <rect width="100" height="100" rx="4" fill="#3E4C59"/>
                  <path d="M33.3 16.7 L50 16.7 L58.1 25.2 L66.7 33.3 L66.7 83.3 L50 83.3 L33.3 66.7 Z" fill="#ffffff"/>
                </svg>
              </td>
              <td style="vertical-align:middle;color:#131F23;font-size:32px;font-weight:500;letter-spacing:-0.015em;line-height:1;">VARS</td>
            </tr></table>
          </td>
        </tr>

        <!-- Eyebrow -->
        <tr>
          <td align="center" style="padding:14px 36px 28px 36px;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#61707D;font-weight:500;">
            Property Management Software
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td align="center" style="padding:0 36px 8px 36px;">
            <h1 style="margin:0 0 12px 0;font-size:22px;font-weight:600;letter-spacing:-0.015em;color:#131F23;line-height:1.3;">
              Welcome to VARS
            </h1>
            <p style="margin:0 0 28px 0;font-size:14px;line-height:1.6;color:#3a4853;">
              We're excited to have you on board.
            </p>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td align="center" style="padding:0 36px 22px 36px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td style="background:#3E4C59;border-radius:8px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;font-size:14px;font-weight:600;letter-spacing:0.02em;color:#ffffff;text-decoration:none;font-family:inherit;">
                  Confirm my email
                </a>
              </td>
            </tr></table>
          </td>
        </tr>

        <!-- Supporting copy -->
        <tr>
          <td align="center" style="padding:0 36px 42px 36px;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#61707D;">
              We just need to confirm this is really you.<br/>
              This link expires in 24 hours.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
