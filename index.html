<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet" href="src/styles/resident.css">

</head>

<script type="text/babel" src="src/data/units.js"></script>

<script type="text/babel" src="src/data/visitors-seed.js"></script>
<script type="text/babel">
// ==================== CONTEXT ====================
const AppContext = createContext();
const useApp = () => useContext(AppContext);

</script>
<script type="text/babel" src="src/i18n/translations.js"></script>
<script type="text/babel" src="src/i18n/switcher.js"></script>
<script type="text/babel">
</script>
<script type="text/babel" src="src/lib/excel-export.js"></script>
<script type="text/babel" src="src/shared/icons.js"></script>
<script type="text/babel" src="src/shared/components.js"></script>
<script type="text/babel" src="src/shared/login.js"></script>
<script type="text/babel" src="src/shared/chat-panel.js"></script>
<script type="text/babel" src="src/shared/sidebar.js"></script>
<script type="text/babel" src="src/shared/topbar.js"></script>
<script type="text/babel">
// ==================== OVERVIEW PAGE ====================
const OverviewPage = ({ setPage }) => {
  const { data, t } = useApp();
  const [pmNow, setPmNow] = useState(new Date());
  const [ovSelectedVisitor, setOvSelectedVisitor] = useState(null);
  const ovQrRef = React.useRef(null);
  useEffect(() => { const iv = setInterval(() => setPmNow(new Date()), 60000); return () => clearInterval(iv); }, []);
  const pmTime = formatTime12(pmNow);
  const pmDate = formatDate(pmNow);

  // ===== Live KPI computation — everything derived from the actual databases =====
  // 1. PROPERTY UNITS — authoritative source for residences & occupancy
  const units = data.propertyUnits || [];
  const totalResidences = units.length;
  const occupiedFlats   = units.filter(u => u.status === 'Occupied').length;
  const vacantFlats     = units.filter(u => u.status === 'Vacant').length;
  const forRentFlats    = units.filter(u => u.status === 'For Rent').length;
  const forSaleFlats    = units.filter(u => u.status === 'For Sale').length;
  const occupancyRate   = totalResidences ? Math.round((occupiedFlats / totalResidences) * 100) : 0;

  // 2. VISITORS — live from the visitors database
  const visitors = data.visitors || [];
  const insideCount    = visitors.filter(v => v.status === 'Inside').length;
  const scheduledCount = visitors.filter(v => v.status === 'Scheduled' || v.status === 'Pre-Approved').length;
  const pendingCount   = visitors.filter(v => v.status === 'Pending').length;

  // 3. SERVICE REQUESTS — live from the service request database
  const serviceRequests = data.serviceRequests || [];
  const todayDay = pmNow.getDate();
  const todayMonthName = pmNow.toLocaleString('en-US', { month: 'short' });
  const todayDateStr = todayDay + ' ' + todayMonthName; // e.g. "13 Apr"
  const todaySR = serviceRequests.filter(sr => sr.date === todayDateStr && sr.status !== 'Completed' && sr.status !== 'Cancelled').length;

  // 4. ALERTS / ESCALATIONS — unresolved + in review
  const escalations = data.escalations || [];
  const unackAlerts = escalations.filter(e => e.status === 'Unresolved' || e.status === 'In Review').length;

  // Mini sparkline SVG paths for KPI cards
  const sparklines = [
    'M0,12 L8,10 L16,11 L24,10 L32,12 L40,11 L48,12', // flat
    'M0,14 L8,12 L16,10 L24,8 L32,6 L40,5 L48,3',     // up
    'M0,10 L8,6 L16,8 L24,4 L32,3 L40,5 L48,2',       // up strong
    'M0,12 L8,10 L16,11 L24,9 L32,7 L40,8 L48,6',     // slight up
    'M0,10 L8,8 L16,6 L24,7 L32,5 L40,3 L48,4',       // up
    'M0,4 L8,6 L16,5 L24,8 L32,10 L40,9 L48,12',      // down
  ];

  // Format with thousands separator
  const fmt = (n) => n.toLocaleString('en-US');

  // Service charge data
  const scTotalBilled = 2840000;
  const scTotalCollected = 2420000;
  const scOutstanding = scTotalBilled - scTotalCollected;
  const scCollectionRate = Math.round((scTotalCollected / scTotalBilled) * 100);
  const arrearsUnits = [
    { unit: 'C-502', block: t('pm.blockLabel')+' C · '+t('pm.floorLabel')+' 5', amount: 18500, due: '2 '+t('pm.monthsWord') },
    { unit: 'D-065', block: t('pm.blockLabel')+' D · '+t('pm.floorLabel')+' 1', amount: 13550, due: '1 '+t('pm.monthsWord') },
    { unit: 'A-1302', block: t('pm.blockLabel')+' A · '+t('pm.floorLabel')+' 6', amount: 4100, due: '12.5 '+t('pm.monthsWord') },
  ];

  const kpis = [
    { label: t('kpi.serviceToday'),          value: fmt(todaySR),               page: 'service' },
    { label: t('kpi.scArrears'),             value: 'AED ' + fmt(scOutstanding), page: 'payment' },
    { label: t('kpi.unresolvedEscalations'), value: fmt(unackAlerts),            page: 'escalations' },
    { label: t('kpi.moveInOut'),             value: fmt(11),                     page: 'properties' },
    { label: t('kpi.occupancy'),             value: occupancyRate + '%',         page: 'properties' },
    { label: t('kpi.appAdoption'),           value: '63%',                       page: 'settings' },
  ];

  // Service Requests requiring action — pull from live database (non-completed, first 5)
  const srAction = serviceRequests
    .filter(sr => sr.status !== 'Completed' && sr.status !== 'Cancelled' && sr.status !== 'Closed')
    .slice(0, 5)
    .map(sr => {
      const action = sr.status === 'Pending Approval' ? t('pm.pendingApproval') : sr.status === 'In Progress' ? t('pm.viewAll') : sr.status === 'Scheduled' ? t('pm.scheduleDate') : t('pm.viewAll');
      return { id: sr.id, type: sr.type, unit: sr.flat, resident: sr.resident, days: sr.date, status: sr.status, action };
    });

  // SR status breakdown data
  const srStatusData = [
    { label: t('pm.srOpen'), count: 12, color: '#d5cfc8' },
    { label: t('pm.srInProgress'), count: 15, color: '#928989' },
    { label: t('pm.srScheduled'), count: 18, color: '#b0a898' },
    { label: t('pm.srCompleted'), count: 22, color: '#c4beb6' },
  ];
  const srTotal = srStatusData.reduce((s, d) => s + d.count, 0);

  // Active escalations
  const escData = [
    { id: 'ESC-041', type: 'SLA Breach',  summary: 'AC Repair overdue > 7d',        unit: 'A-0302', open: '8h', severity: 'Critical' },
    { id: 'ESC-038', type: 'Security',    summary: 'Guard override not reviewed',    unit: 'C-0501', open: '3h', severity: 'High' },
    { id: 'ESC-035', type: 'Compliance',  summary: 'Fire safety doc missing',        unit: 'B-0903', open: '2d', severity: 'High' },
  ];

  // Activity feed items
  const ovFeed = [
    { color: '#c0392b', text: 'ESC-041 raised — SLA breach on SR-1042', time: '10:08' },
    { color: '#e67e22', text: 'Guard override used — Flat C-0501', time: '09:58' },
    { color: '#3498db', text: 'SR-1038 status changed → In Progress', time: '09:44' },
    { color: '#27ae60', text: 'Move-in confirmed — Unit A-0202 (15 Mar)', time: '09:31' },
    { color: '#3498db', text: 'Announcement sent — Pool maintenance notice', time: '09:14' },
    { color: '#888', text: 'Service charge reminder sent — 5 units', time: '08:50' },
    { color: '#888', text: 'SR-1025 assigned to ProServ Cleaning Co.', time: '08:33' },
    { color: '#c0392b', text: 'ESC-035 escalated — Compliance flag raised', time: '08:11' },
  ];

  // Operations Calendar data
  const calMonth = 2; // March 2026 (0-indexed)
  const calYear = 2026;
  const calDaysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const calFirstDay = new Date(calYear, calMonth, 1).getDay();
  const calToday = 10;
  const calEventDays = [10, 15, 17, 18, 22, 25];
  const todayEvents = [
    { time: '11:00', title: 'Tech Support — Etisalat', unit: 'A-0302', badge: 'Vendor', badgeColor: '#e8e3de' },
    { time: '13:00', title: 'Move-In — Nour Al-Rashid', unit: 'C-0904', badge: 'Move', badgeColor: '#e0e5db' },
  ];

  // QR code rendering for visitor detail modal
  const getQrUrl = (permit) => 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(permit || 'UNKNOWN');
  useEffect(() => {
    if (ovSelectedVisitor && ovQrRef.current) {
      const permit = ovSelectedVisitor.permitRef || ovSelectedVisitor.name;
      ovQrRef.current.innerHTML = '<img src="' + getQrUrl(permit) + '" width="200" height="200" style="display:block;margin:0 auto;" crossorigin="anonymous" />';
    }
  }, [ovSelectedVisitor]);

  return (
    <div>
      <div className="page-header">
        <div><h1>{t('pm.overviewTitle')}</h1></div>
        <div style={{fontSize:12,color:'#a89a92'}}>Abu Dhabi · GST+4 &nbsp; {pmDate + ', ' + pmTime}</div>
      </div>

      {/* KPI Header */}
      <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:14}}>
        <span style={{fontSize:14,fontWeight:600,color:'#1a1a1a'}}>{t('pm.kpiHeader')}</span>
        <span style={{fontSize:12,color:'#a89a92'}}>{t('common.today')}, {pmDate}</span>
      </div>

      {/* KPI Cards — 6 columns */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:12,marginBottom:28}}>
        {kpis.map((k,i) => (
          <div key={i} className="kpi-card" style={{padding:'16px 18px',display:'flex',flexDirection:'column'}}>
            <div style={{fontSize:11,color:'#a89a92',marginBottom:6}}>{k.label}</div>
            <div style={{fontSize:22,fontWeight:600,color:'#1a1a1a',flex:1}}>{k.value}</div>
            <div style={{fontSize:11,color:'#a89a92',marginTop:10,cursor:'pointer'}} onClick={()=>setPage(k.page)}>{t('kpi.viewDetails')} →</div>
          </div>
        ))}
      </div>

      {/* Main Content: Left + Right */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:20}}>
        {/* LEFT COLUMN */}
        <div style={{display:'flex',flexDirection:'column',gap:20}}>

          {/* Service Request Summary */}
          <div className="card" style={{padding:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
              <h3 style={{margin:0,fontSize:15,fontWeight:600}}>{t('pm.srSummary')}</h3>
              <span style={{fontSize:12,color:'#a89a92',cursor:'pointer'}} onClick={()=>setPage('service')}>{t('pm.viewAll')} →</span>
            </div>
            <div style={{fontSize:12,color:'#a89a92',marginBottom:14}}>{t('pm.srStatusBreakdown')}</div>

            {/* Stacked horizontal bar */}
            <div style={{display:'flex',height:28,borderRadius:4,overflow:'hidden',marginBottom:10}}>
              {srStatusData.map((s,i) => (
                <div key={i} style={{width:(s.count/srTotal*100)+'%',background:s.color,transition:'width .3s'}}/>
              ))}
            </div>
            {/* Legend */}
            <div style={{display:'flex',gap:20,fontSize:11,color:'#a89a92',marginBottom:24}}>
              {srStatusData.map((s,i) => (
                <span key={i} style={{display:'flex',alignItems:'center',gap:5}}>
                  <span style={{width:8,height:8,borderRadius:'50%',background:s.color,display:'inline-block'}}/> {s.label}
                </span>
              ))}
            </div>

            {/* Service Requests Requiring Action */}
            <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>{t('pm.srRequireAction')}</div>
            <div style={{fontSize:11,color:'#a89a92',marginBottom:12}}>{t('pm.srRequireActionDesc')}</div>
            <table className="data-table" style={{fontSize:12}}>
              <thead><tr><th>{t('pm.th.srId')}</th><th>{t('pm.th.type')}</th><th>{t('pm.th.unit')}</th><th>{t('pm.th.resident')}</th><th>{t('pm.th.date')}</th><th>{t('pm.th.status')}</th><th>{t('pm.th.action')}</th></tr></thead>
              <tbody>
                {srAction.map(sr => (
                  <tr key={sr.id}>
                    <td style={{fontWeight:500}}>{sr.id}</td>
                    <td>{sr.type}</td>
                    <td>{sr.unit}</td>
                    <td>{sr.resident}</td>
                    <td>{sr.days}</td>
                    <td><StatusBadge status={sr.status}/></td>
                    <td>
                      <button className="btn btn-sm" style={{fontSize:11,padding:'4px 10px',borderRadius:4}}>
                        {sr.action}
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Active Escalations */}
          <div className="card" style={{padding:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <h3 style={{margin:0,fontSize:15,fontWeight:600}}>{t('pm.escalations')}</h3>
              <span style={{fontSize:12,color:'#a89a92',cursor:'pointer'}} onClick={()=>setPage('escalations')}>{t('pm.viewAll')} →</span>
            </div>
            <table className="data-table" style={{fontSize:12}}>
              <thead><tr><th>{t('pm.th.id')}</th><th>{t('pm.th.type')}</th><th>{t('pm.th.summary')}</th><th>{t('pm.th.unit')}</th><th>{t('pm.th.open')}</th><th>{t('pm.th.severity')}</th></tr></thead>
              <tbody>
                {escData.map(e => (
                  <tr key={e.id}>
                    <td style={{fontWeight:500}}>{e.id}</td>
                    <td>{e.type}</td>
                    <td>{e.summary}</td>
                    <td>{e.unit}</td>
                    <td>{e.open}</td>
                    <td>
                      <span style={{
                        display:'inline-block',padding:'3px 10px',borderRadius:4,fontSize:11,fontWeight:500,
                        background: e.severity === 'Critical' ? '#f8d7da' : '#fff3cd',
                        color: e.severity === 'Critical' ? '#721c24' : '#856404'
                      }}>{e.severity === 'Critical' ? t('pm.severityCritical') : e.severity === 'High' ? t('pm.severityHigh') : e.severity === 'Medium' ? t('pm.severityMedium') : e.severity === 'Low' ? t('pm.severityLow') : e.severity}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Activity Feed */}
          <div className="card" style={{padding:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <h3 style={{margin:0,fontSize:15,fontWeight:600}}>{t('pm.activityFeed')}</h3>
              <span style={{fontSize:12,color:'#a89a92',cursor:'pointer'}}>{t('pm.viewAll')} →</span>
            </div>
            <div style={{fontSize:12,color:'#a89a92',marginBottom:12}}>{t('pm.activityFeedDesc')}</div>
            {ovFeed.map((item,i) => (
              <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 0',borderTop: i > 0 ? '1px solid #f5f2ef' : 'none'}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:item.color,marginTop:5,flexShrink:0}}/>
                <div style={{flex:1}}>
                  <span style={{fontSize:12,color:'#1a1a1a'}}><span style={{color:'#a89a92',marginRight:6}}>{item.time}</span>{item.text}</span>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* RIGHT COLUMN */}
        <div style={{display:'flex',flexDirection:'column',gap:20}}>

          {/* Service Charge Collection */}
          <div className="card" style={{padding:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
              <h3 style={{margin:0,fontSize:15,fontWeight:600}}>{t('pm.scCollection')}</h3>
              <span style={{fontSize:12,color:'#a89a92',cursor:'pointer'}} onClick={()=>setPage('payment')}>{t('pm.viewAll')} →</span>
            </div>
            <div style={{fontSize:12,color:'#a89a92',marginBottom:18}}>Q1 2026 · {t('pm.scQuarter')}</div>

            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:'#a89a92',marginBottom:4}}>{t('pm.scTotalBilled')}</div>
              <div style={{fontSize:22,fontWeight:600,color:'#1a1a1a'}}>AED {fmt(scTotalBilled)}</div>
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:'#a89a92',marginBottom:4}}>{t('pm.scTotalCollected')}</div>
              <div style={{fontSize:22,fontWeight:600,color:'#1a1a1a'}}>AED {fmt(scTotalCollected)}</div>
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:'#a89a92',marginBottom:4}}>{t('pm.scOutstanding')}</div>
              <div style={{fontSize:22,fontWeight:600,color:'#c0392b'}}>AED {fmt(scOutstanding)}</div>
            </div>

            {/* Collection rate bar */}
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#a89a92',marginBottom:6}}>
              <span>{t('pm.scCollectionRate')} · {scCollectionRate}%</span>
            </div>
            <div style={{height:6,background:'#ebe7e3',borderRadius:3,marginBottom:20,overflow:'hidden'}}>
              <div style={{height:'100%',width:scCollectionRate+'%',background:'#928989',borderRadius:3}}/>
            </div>

            {/* Units in Arrears */}
            <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>{t('pm.scUnitsInArrears')}</div>
            <div style={{fontSize:11,color:'#a89a92',marginBottom:12}}>{arrearsUnits.length} {t('pm.scUnits')} · {t('pm.scTotal')} AED {fmt(arrearsUnits.reduce((s,u)=>s+u.amount,0))}</div>

            {arrearsUnits.map((u,i) => (
              <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#faf8f6',borderRadius:8,marginBottom:8,border:'1px solid #ebe7e3'}}>
                <div style={{width:32,height:32,borderRadius:6,background:'#928989',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:600,flexShrink:0}}>
                  {u.unit.charAt(0)}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>{u.unit}</div>
                  <div style={{fontSize:11,color:'#a89a92'}}>{u.block}</div>
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>AED {fmt(u.amount)}</div>
                  <div style={{fontSize:10,color:'#c0392b'}}>{t('pm.scDueFrom')} {u.due}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Operations Calendar */}
          <div className="card" style={{padding:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <h3 style={{margin:0,fontSize:15,fontWeight:600}}>{t('pm.opsCalendar')}</h3>
              <span style={{fontSize:13,color:'#a89a92'}}>{t('pm.months.mar')} {calYear}</span>
            </div>

            {/* Calendar grid */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,textAlign:'center',marginBottom:16}}>
              {['S','M','T','W','T','F','S'].map((d,i) => (
                <div key={i} style={{fontSize:10,color:'#a89a92',padding:'4px 0',fontWeight:500}}>{d}</div>
              ))}
              {Array.from({length:calFirstDay}).map((_,i) => <div key={'e'+i}/>)}
              {Array.from({length:calDaysInMonth}).map((_,i) => {
                const day = i + 1;
                const isToday = day === calToday;
                const hasEvent = calEventDays.includes(day);
                return (
                  <div key={day} style={{
                    padding:'4px 0',fontSize:12,
                    background: isToday ? '#928989' : 'transparent',
                    color: isToday ? '#fff' : '#1a1a1a',
                    borderRadius: isToday ? '50%' : 0,
                    width: isToday ? 28 : 'auto', height: isToday ? 28 : 'auto',
                    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                    margin: isToday ? '0 auto' : 0,
                    fontWeight: isToday ? 600 : 400,
                    position:'relative'
                  }}>
                    {day}
                    {hasEvent && !isToday && <div style={{width:3,height:3,borderRadius:'50%',background:'#928989',marginTop:1}}/>}
                  </div>
                );
              })}
            </div>

            {/* Today's events */}
            <div style={{borderTop:'1px solid #ebe7e3',paddingTop:14}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Today — {calToday} March</div>
              {todayEvents.map((ev,i) => (
                <div key={i} style={{marginBottom:12}}>
                  <div style={{fontSize:10,color:'#a89a92',marginBottom:2}}>{ev.time}</div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:500,color:'#1a1a1a'}}>{ev.title}</div>
                      <div style={{fontSize:11,color:'#a89a92'}}>{ev.unit}</div>
                    </div>
                    <span style={{fontSize:11,padding:'3px 10px',borderRadius:4,background:ev.badgeColor,color:'#1a1a1a',fontWeight:500}}>{ev.badge}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ==================== VISITORS PAGE ====================
const VisitorsPage = () => {
  const { data, setData, showToast } = useApp();
  const [typeFilter, setTypeFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');
  const [selectedVisitor, setSelectedVisitor] = useState(null);
  const [showManualEntry, setShowManualEntry] = useState(false);
  const [search, setSearch] = useState('');
  const [pmcFormStep, setPmcFormStep] = useState('form');
  const [formErrors, setFormErrors] = useState({});
  const [isCreatingVisitor, setIsCreatingVisitor] = useState(false);
  const [pmcUnitFocused, setPmcUnitFocused] = useState(false);
  const [newVisitor, setNewVisitor] = useState({
    visitorType: 'Resident Guest',
    entryType: 'Walk-in',
    fullName: '',
    mobile: '',
    idDocType: '',
    idDocNumber: '',
    flat: '',
    tower: 'Tower A',
    host: '',
    additionalVisitors: 0,
    vehicle: '',
    notes: '',
    purpose: '',
    repeater: 'Single Visit'
  });

  const types = ['All','Guest','Vendor','Contractor'];
  const statuses = ['All','Inside','Pending','Pre-Approved','Scheduled','Checked Out'];

  const filtered = data.visitors.filter(v => {
    if (typeFilter !== 'All' && v.type !== typeFilter) return false;
    if (statusFilter !== 'All' && v.status !== statusFilter) return false;
    if (search && !v.name.toLowerCase().includes(search.toLowerCase()) && !v.flat.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }).sort((a, b) => {
    // Sort by date in descending order (newest first)
    // Parse dates like "10 Mar" to compare
    const dateA = new Date(a.date + ' 2026');
    const dateB = new Date(b.date + ' 2026');
    return dateB - dateA;
  });

  const resetPmcVisitorForm = () => {
    setPmcFormStep('form');
    setNewVisitor({
      visitorType: 'Resident Guest', entryType: 'Walk-in', fullName: '', mobile: '',
      idDocType: '', idDocNumber: '', flat: '', tower: 'Tower A', host: '',
      additionalVisitors: 0, vehicle: '', notes: '', purpose: '', repeater: 'Single Visit'
    });
  };

  const validatePmcVisitorForm = () => {
    const errors = {};
    if (!newVisitor.fullName.trim()) { errors.fullName = 'Visitor name is required'; }
    else if (!/^[a-zA-Z\s]+$/.test(newVisitor.fullName)) { errors.fullName = 'Name must contain only letters and spaces'; }
    if (!newVisitor.mobile.trim()) { errors.mobile = 'Mobile number is required'; }
    if (!newVisitor.flat.trim()) { errors.flat = 'Flat/unit number is required'; }
    if (newVisitor.visitorType !== 'Resident Guest' && !newVisitor.idDocType) { errors.idDocType = 'ID document is required'; }

    if (Object.keys(errors).length > 0) {
      setFormErrors(errors);
      showToast('Please fill in all required fields');
      setIsSubmitting(false); return;
    }
    setFormErrors({});
    setIsCreatingVisitor(true);
    setPmcFormStep('review');
  };

  const handleCreateVisitor = () => {
    const timeNow = new Date();
    const timeStr = formatTime12(timeNow);
    const dateStr = formatDateShort(timeNow);
    const id = 'VIS-' + timeNow.getTime() + '-' + Math.random().toString(36).substr(2, 9).toUpperCase();
    const permitRef = 'VIS-' + timeNow.getFullYear() + '-' + String(Date.now() % 10000).padStart(4,'0');
    const idDocFull = newVisitor.idDocType ? (newVisitor.idDocType + (newVisitor.idDocNumber ? ': ' + newVisitor.idDocNumber : '')) : '';
    // For single-visit QR: set validity to end of current day (23:59:59 Dubai time)
    // For multiple-visit QR: set validity to "Until Cancelled" (no auto-expiry)
    const validUntil = newVisitor.repeater === 'Single Visit' ? (dateStr + ' 23:59:59') : 'Until Cancelled';

    const isoDate = timeNow.getFullYear()+'-'+String(timeNow.getMonth()+1).padStart(2,'0')+'-'+String(timeNow.getDate()).padStart(2,'0');
    const entry = {
      id, name: newVisitor.fullName.trim(), resident: newVisitor.host.trim() || 'Pending Assignment',
      flat: newVisitor.flat.trim(), contact: newVisitor.mobile.trim(), type: newVisitor.visitorType,
      gate: 'Main Gate', status: 'Pending', time: timeStr, date: dateStr, dateIn: isoDate, dateOut: '', permitRef,
      duration: newVisitor.repeater === 'Single Visit' ? 'Day pass' : 'Multi-entry',
      qrCode: 'Pending', entryType: newVisitor.entryType, idDoc: idDocFull,
      vehicle: newVisitor.vehicle.trim(), additionalVisitors: newVisitor.additionalVisitors,
      notes: newVisitor.notes.trim(), purpose: newVisitor.purpose.trim() || newVisitor.visitorType + ' visit',
      repeater: newVisitor.repeater, validUntil
    };
    setData(prev => ({...prev, visitors: [entry, ...prev.visitors]}));
    resetPmcVisitorForm();
    setShowManualEntry(false);
    setIsCreatingVisitor(false);
    showToast('Visitor entry created successfully!');
  };

  const handleApprove = (v) => {
    setData(prev => ({
      ...prev,
      visitors: prev.visitors.map(vis => vis.id === v.id ? {...vis, status:'Passed Security'} : vis),
      notifications: [...(prev.notifications || []), {
        id: 'notif-' + Date.now(),
        type: 'visitor_approved',
        title: v.name + ' approved',
        message: v.name + ' has been approved to enter. Status: Passed Security',
        time: formatTime12(new Date()),
        timestamp: new Date().toISOString(),
        read: false,
        visitorId: v.id,
        visitorName: v.name,
        flat: v.flat
      }]
    }));
    showToast(`${v.name} approved - Passed Security`);
  };

  const handleReject = (v) => {
    setData(prev => ({
      ...prev,
      visitors: prev.visitors.map(vis => vis.id === v.id ? {...vis, status:'Denied Entry'} : vis),
      notifications: [...(prev.notifications || []), {
        id: 'notif-' + Date.now(),
        type: 'visitor_rejected',
        title: v.name + ' rejected',
        message: v.name + ' has been denied entry',
        time: formatTime12(new Date()),
        timestamp: new Date().toISOString(),
        read: false,
        visitorId: v.id,
        visitorName: v.name,
        flat: v.flat

    exportToExcel(filtered, [

      {header:'Gate', key:'gate'}, {header:'Status', key:'status'}, {header:'Permit Ref', key:'permitRef'},
      {header:'Resident', key:'resident'}, {header:'Duration', key:'duration'}
    ], 'VARS_Visitors_Export');
    showToast('Visitors exported to Excel!');
  };

  const visitorCounts = { Guests: data.visitors.filter(v=>v.type==='Guest'&&v.status==='Inside').length, Vendors: data.visitors.filter(v=>v.type==='Vendor'&&v.status==='Inside').length, Contractors: data.visitors.filter(v=>v.type==='Contractor'&&v.status==='Inside').length };

        <div><h1>{t('pm.visitorsLiveLog')}</h1><div className="subtitle">86 {t('pm.guestsInside')} · 7 {t('pm.pendingApprovalCount')}</div></div>
        <button className="btn btn-primary" onClick={()=>setShowManualEntry(true)}>✦ {t('pm.createRequest')}</button>
      </div>

      <div className="kpi-row" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <div className="kpi-card"><div className="label">{t('pm.guestsInside')}</div><div style={{display:'flex',alignItems:'baseline',gap:8}}><span className="value">34</span><span style={{fontSize:12,color:'#a89a92'}}>40%</span></div></div>
        <div className="kpi-card"><div className="label">{t('pm.vendorsInside')}</div><div style={{display:'flex',alignItems:'baseline',gap:8}}><span className="value">28</span><span style={{fontSize:12,color:'#a89a92'}}>33%</span></div></div>
        <div className="kpi-card"><div className="label">{t('pm.contractorsInside')}</div><div style={{display:'flex',alignItems:'baseline',gap:8}}><span className="value">24</span><span style={{fontSize:12,color:'#a89a92'}}>28%</span></div></div>
        <div className="kpi-card"><div className="label">{t('pm.pendingApprovalCount')}</div><span className="value">7</span></div>
      </div>

      <div className="card">
        <div style={{display:'flex',gap:16,marginBottom:16,alignItems:'center',flexWrap:'wrap'}}>
          <div className="search-bar" style={{flex:1,maxWidth:400}}>
            <span className="search-icon"><Icon name="search" size={14}/></span>
            <input placeholder="Search by name, flat, type..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <span style={{fontSize:12,color:'#8a7f76',marginRight:4}}>{t('pm.visitorType')}:</span>
            {types.map(typeItem => <span key={typeItem} className={`chip ${typeFilter===typeItem?'active':''}`} onClick={()=>setTypeFilter(typeItem)}>{typeItem}</span>)}
          </div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <span style={{fontSize:12,color:'#8a7f76',marginRight:4}}>{t('pm.visitorStatus')}:</span>
            {statuses.map(s => <span key={s} className={`chip ${statusFilter===s?'active':''}`} onClick={()=>setStatusFilter(s)}>{s}</span>)}
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <span style={{fontSize:13,color:'#8a7f76'}}>{filtered.length} {t('pm.visitorResults')}</span>
          <button className="btn btn-sm" onClick={handleExportExcel}><Icon name="download" size={12}/> {t('pm.exportExcel')}</button>
        </div>
        <table className="data-table">
          <thead><tr><th>{t('pm.tableHeaderDateIn') || 'Date In'}</th><th>{t('pm.tableHeaderTime') || 'Time'}</th><th>{t('pm.tableHeaderDateOut') || 'Date Out'}</th><th>{t('pm.tableHeaderName')}</th><th>{t('pm.tableHeaderFlat')}</th><th>{t('pm.tableHeaderContact')}</th><th>{t('pm.typeLabel')}</th><th>{t('pm.tableHeaderGate') || 'Gate'}</th><th>{t('pm.tableHeaderStatus') || 'Status'}</th><th>{t('pm.tableHeaderActions')}</th></tr></thead>

                  </div>

                  {/* Section 02 — Visit Details */}
                  <div style={{background:'#fff',border:'1px solid #ebe7e3',borderRadius:6,padding:20}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:20}}>
                      <div style={{fontSize:12,fontWeight:600,color:'#1a1a1a',display:'flex',alignItems:'center',gap:8}}><span style={{background:'#e8e3de',padding:'2px 8px',borderRadius:3,fontSize:10,color:'#a89a92'}}>02</span> {t('sec.visitDetails')}</div>
                                          </div>

                    {/* Flat / Unit + Tower */}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
                      <div style={{position:'relative'}}>
                        <label style={{fontSize:10,color:'#a89a92',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:6}}>{t('sec.unitNo')} *</label>
                        <input value={newVisitor.flat}
                          onChange={e => {

                            const resident = RESIDENT_BY_UNIT[val.trim()];
                            setNewVisitor({
                              ...newVisitor,
                              flat: val,
                              host: resident ? resident.fullName : newVisitor.host,
                              tower: resident ? resident.tower : newVisitor.tower
                            });
                            setPmcUnitFocused(true);
                          }}
                          onFocus={() => setPmcUnitFocused(true)}
                          onBlur={() => setTimeout(() => setPmcUnitFocused(false), 150)}
                          placeholder={t('sec.phTypeUnit')}
                          style={{width:'100%',padding:'10px 12px',background:'#fff',border:formErrors.flat ? '2px solid #d32f2f' : '1px solid #d5cfc8',borderRadius:4,color:'#1a1a1a',fontSize:13,boxSizing:'border-box',outline:'none'}}/>

                          return (

                              {matches.map(u => {
                                const res = RESIDENT_BY_UNIT[u];
                                return (

                                      e.preventDefault();
                                      setNewVisitor({

                                        flat: u,

                                    onMouseEnter={e => e.currentTarget.style.background='#f5f3f0'}

                                    <span style={{fontWeight:600}}>Unit {u}</span>
                                    <span style={{color:'#a89a92'}}> / {res ? res.fullName : 'Vacant'}</span>

                      <div>
                        <label style={{fontSize:10,color:'#a89a92',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:6}}>{t('sec.towerBlock')}</label>

                          style={{width:'100%',padding:'10px 12px',background:'#fff',border:'1px solid #d5cfc8',borderRadius:4,color:'#1a1a1a',fontSize:13,boxSizing:'border-box',outline:'none'}}>
                          <option>{t('pm.towerA')}</option><option>{t('pm.towerB')}</option><option>{t('pm.towerC')}</option><option>{t('pm.towerD')}</option>
                        </select>
                      </div>
                    </div>

                    {/* Host / Resident */}
                    <div style={{marginBottom:16}}>
                      <label style={{fontSize:10,color:'#a89a92',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:6}}>{t('sec.residentName')} *</label>
                      <input value={newVisitor.host} onChange={e => setNewVisitor({...newVisitor, host: e.target.value})}
                        placeholder={t('sec.phAutoPopulated')}
                        style={{width:'100%',padding:'10px 12px',background:'#fff',border:formErrors.host ? '2px solid #d32f2f' : '1px solid #d5cfc8',borderRadius:4,color:'#1a1a1a',fontSize:13,boxSizing:'border-box',outline:'none'}}/>
                      {formErrors.host && <div style={{fontSize:11,color:'#d32f2f',marginTop:4}}>{formErrors.host}</div>}
                    </div>

                    {/* Visit Frequency */}
                    <div style={{marginBottom:16}}>
                      <label style={{fontSize:10,color:'#a89a92',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:8}}>{t('sec.visitFrequency')}</label>
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                        {['Single Visit','Multiple Entry'].map(r => (
                          <div key={r} onClick={() => setNewVisitor({...newVisitor, repeater: r})}
                            style={{padding:10,border: newVisitor.repeater === r ? '1.5px solid #1a1a1a' : '1px solid #d0d0d0',borderRadius:4,textAlign:'center',cursor:'pointer',background: newVisitor.repeater === r ? '#f0f0f0' : 'transparent',fontSize:12,color: newVisitor.repeater === r ? '#1a1a1a' : '#8a8a8a'}}>
                            {r}
                          </div>
                        ))}
                      </div>
                      <div style={{fontSize:10,color:'#a89a92',marginTop:4}}>
                        {newVisitor.repeater === 'Single Visit' ? 'Valid for today only' : 'Valid until cancelled by resident'}
                      </div>
                    </div>

                    {/* Additional Visitors + Vehicle */}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
                      <div>
                        <label style={{fontSize:10,color:'#a89a92',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:6}}>{t('sec.additionalVisitors')}</label>
                        <div style={{display:'flex',alignItems:'center',gap:0}}>
                          <button onClick={() => setNewVisitor({...newVisitor, additionalVisitors: Math.max(0, newVisitor.additionalVisitors - 1)})}
                            style={{width:36,height:36,background:'#fff',border:'1px solid #d5cfc8',borderRadius:'4px 0 0 4px',color:'#1a1a1a',fontSize:16,cursor:'pointer'}}>-</button>
                          <div style={{width:48,height:36,background:'#e8e3de',border:'1px solid #d5cfc8',borderLeft:'none',borderRight:'none',display:'flex',alignItems:'center',justifyContent:'center',color:'#1a1a1a',fontSize:14,fontWeight:600}}>{newVisitor.additionalVisitors}</div>
                          <button onClick={() => setNewVisitor({...newVisitor, additionalVisitors: newVisitor.additionalVisitors + 1})}
                            style={{width:36,height:36,background:'#fff',border:'1px solid #d5cfc8',borderRadius:'0 4px 4px 0',color:'#1a1a1a',fontSize:16,cursor:'pointer'}}>+</button>
                        </div>
                        <div style={{fontSize:10,color:'#a89a92',marginTop:4}}>Total visitors: {1 + newVisitor.additionalVisitors}</div>
                      </div>
                      <div>
                        <label style={{fontSize:10,color:'#a89a92',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:6}}>{t('sec.vehicleNumber')}</label>
                        <input value={newVisitor.vehicle} onChange={e => setNewVisitor({...newVisitor, vehicle: e.target.value})}
                          placeholder="e.g. AB 12345 — leave blank if no"
                          style={{width:'100%',padding:'10px 12px',background:'#fff',border:'1px solid #d5cfc8',borderRadius:4,color:'#1a1a1a',fontSize:13,boxSizing:'border-box',outline:'none'}}/>
                      </div>
                    </div>

                    {/* Notes */}
                    <div>
                      <label style={{fontSize:10,color:'#a89a92',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:6}}>Notes / Remarks</label>
                      <textarea value={newVisitor.notes} onChange={e => setNewVisitor({...newVisitor, notes: e.target.value})}
                        placeholder={t('sec.phObservations')}
                        rows={3}
                        style={{width:'100%',padding:'10px 12px',background:'#fff',border:'1px solid #d5cfc8',borderRadius:4,color:'#1a1a1a',fontSize:13,boxSizing:'border-box',outline:'none',resize:'vertical',fontFamily:'inherit'}}/>
                    </div>
                  </div>
                </div>

                {/* Review Button */}
                <button onClick={validatePmcVisitorForm} disabled={isCreatingVisitor}
                  style={{width:'100%',padding:16,background:isCreatingVisitor ? '#a89a92' : '#928989',color:'#fff',border:'none',borderRadius:4,fontSize:15,fontWeight:700,cursor:isCreatingVisitor ? 'not-allowed' : 'pointer',marginTop:20,letterSpacing:'0.04em',opacity:isCreatingVisitor ? 0.7 : 1}}>
                  {isCreatingVisitor ? 'Validating...' : 'Review Visitor Entry'}
                </button>
              </>
            ) : (
              /* REVIEW STEP */
              <div style={{maxWidth:600,margin:'0 auto'}}>
                <div style={{background:'#fff',border:'1px solid #ebe7e3',borderRadius:8,overflow:'hidden',marginBottom:20}}>
                  {/* Review Header */}
                  <div style={{background:'#e8e3de',padding:'16px 20px',borderBottom:'1px solid #d0d0d0'}}>
                    <div style={{display:'flex',alignItems:'center',gap:12}}>
                      <div style={{width:44,height:44,borderRadius:'50%',background:'#928989',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:700,color:'#fff'}}>
                        {newVisitor.fullName.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2)}
                      </div>
                      <div>
                        <div style={{fontSize:16,fontWeight:600,color:'#1a1a1a'}}>{newVisitor.fullName}</div>
                        <div style={{fontSize:12,color:'#1a1a1a'}}>{newVisitor.visitorType}</div>
                      </div>
                    </div>
                  </div>

                  {/* Review Details */}
                  <div style={{padding:20}}>
                    {[
                      ['Mobile', newVisitor.mobile],
                      ['Entry Type', newVisitor.entryType],
                      ['ID Document', newVisitor.idDocType ? (newVisitor.idDocType + (newVisitor.idDocNumber ? ': ' + newVisitor.idDocNumber : '')) : 'Not provided'],
                      ['Purpose', newVisitor.purpose || newVisitor.visitorType + ' visit'],
                      ['Unit', newVisitor.flat + ' — ' + newVisitor.tower],
                      ['Host / Resident', newVisitor.host || 'Pending Assignment'],
                      ['Visit Frequency', newVisitor.repeater],
                      ['Additional Visitors', newVisitor.additionalVisitors > 0 ? '+' + newVisitor.additionalVisitors + ' (' + (1 + newVisitor.additionalVisitors) + ' total)' : 'None'],
                      ['Vehicle', newVisitor.vehicle || 'No vehicle'],
                      ['Notes', newVisitor.notes || '—']
                    ].map(([label, val], i) => (
                      <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom: i < 9 ? '1px solid #e0e0e0' : 'none'}}>
                        <span style={{fontSize:12,color:'#a89a92'}}>{label}</span>
                        <span style={{fontSize:12,color:'#1a1a1a',fontWeight:500,textAlign:'right',maxWidth:'60%'}}>{val}</span>
                      </div>
                    ))}
                  </div>

                  {/* Status indicator */}
                  <div style={{padding:'12px 20px',background:'#e8e3de',borderTop:'1px solid #d5cfc8',display:'flex',alignItems:'center',gap:8}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" strokeWidth="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M9 12l2 2 4-4"/></svg>
                    <span style={{fontSize:11,color:'#1a1a1a'}}>{t('pm.pendingEntryText')}</span>
                  </div>
                </div>

                {/* Confirm Button */}
                <button onClick={handleCreateVisitor}
                  style={{width:'100%',padding:16,background:'#928989',color:'#fff',border:'none',borderRadius:6,fontSize:15,fontWeight:700,cursor:'pointer',letterSpacing:'0.04em'}}>
                  Confirm & Create Entry
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
};

// ==================== SERVICE REQUESTS PAGE ====================
const ServiceRequestsPage = () => {
  const { data, setData, showToast, t } = useApp();
  const [viewMode, setViewMode] = useState('Calendar');
  const [showSchedule, setShowSchedule] = useState(null);
  const [showNewRequest, setShowNewRequest] = useState(false);
  const [expandedSR, setExpandedSR] = useState(null);
  const [srPage, setSrPage] = useState(1);
  const [srPageSize, setSrPageSize] = useState(10);
  const [selectedPersonnel, setSelectedPersonnel] = useState(null);
  const [newSR, setNewSR] = useState({ flat:'', type:'', resident:'', dateTime:'', sla:'', notes:'' });
  const [selectedDate, setSelectedDate] = useState(new Date());

  // Enrich SR data with SLA
  const srWithSLA = data.serviceRequests.map(r => ({
    ...r,
    sla: r.sla || ({'AC Repair':'4h','Installation':'4h','Move-In':'2h','Move-Out':'2h','Handyman':'2h','Pest Control':'8h','Plumbing':'2h','Electrical':'2h'}[r.type] || '4h')
  }));

  const activeCount = srWithSLA.filter(r => r.status !== 'Completed').length;
  const pendingCount = srWithSLA.filter(r => r.status === 'Pending Approval').length;
  const escalatedCount = srWithSLA.filter(r => r.status === 'Escalated').length;

  const handleCreateSR = () => {
    if (!newSR.flat || !newSR.type) { showToast(t('pm.flatServiceTypeMissing')); return; }
    const id = `SR-${1092 + data.serviceRequests.length}`;
    const dtParts = newSR.dateTime ? newSR.dateTime.split(' · ') : [];
    const entry = { id, type: newSR.type, flat: newSR.flat, resident: newSR.resident || 'Pending', date: dtParts[0] || '10 Mar', time: dtParts[1] || '10:00', status: 'Pending Approval', sla: newSR.sla || '4h', notes: newSR.notes };
    setData(prev => ({...prev, serviceRequests: [entry, ...prev.serviceRequests]}));
    setNewSR({ flat:'', type:'', resident:'', dateTime:'', sla:'', notes:'' });
    setShowNewRequest(false);
    showToast(t('pm.srCreated'));
  };

  const handleExportSR = () => {
    exportToExcel(srWithSLA, [
      {header:'ID', key:'id'}, {header:'Type', key:'type'}, {header:'Flat', key:'flat'},
      {header:'Resident', key:'resident'}, {header:'Date', key:'date'}, {header:'Time', key:'time'},
      {header:'Status', key:'status'}, {header:'SLA', key:'sla'}
    ], 'VARS_ServiceRequests_Export');
    showToast(t('pm.srExported'));
  };

  // Normalize SR date "12 Apr" → { day:12, month:3 (0-indexed) }
  const parseSRDate = (dateStr) => {
    if (!dateStr) return null;
    const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const parts = dateStr.trim().split(' ');
    if (parts.length === 2 && months[parts[1]] !== undefined) {
      return { day: parseInt(parts[0],10), month: months[parts[1]] };
    }
    return null;
  };

  // Build event day map for calendar dots: { "2026-04-12": "AC Repair" }
  const eventDayMap = {};
  srWithSLA.forEach(r => {
    const p = parseSRDate(r.date);
    if (p) {
      const key = '2026-' + String(p.month+1).padStart(2,'0') + '-' + String(p.day).padStart(2,'0');
      if (!eventDayMap[key]) eventDayMap[key] = r.type;
    }
  });

  // Filter requests for selected date — compare day+month directly
  const selD = selectedDate instanceof Date ? selectedDate : new Date(selectedDate);
  const selDay = selD.getDate();
  const selMonth = selD.getMonth();
  const dayRequests = srWithSLA.filter(r => {
    const p = parseSRDate(r.date);
    return p && p.day === selDay && p.month === selMonth;
  });

  // Sort: upcoming (non-completed) first by date ascending, then completed by date descending
  const srDateVal = (r) => {
    const p = parseSRDate(r.date);
    return p ? (p.month * 31 + p.day) : 0;
  };
  const sortedSR = [...srWithSLA].sort((a, b) => {
    const aCompleted = a.status === 'Completed';
    const bCompleted = b.status === 'Completed';
    if (aCompleted !== bCompleted) return aCompleted ? 1 : -1; // upcoming first
    if (!aCompleted) return srDateVal(a) - srDateVal(b); // upcoming: earliest first
    return srDateVal(b) - srDateVal(a); // completed: most recent first
  });

  // Pagination
  const totalSR = sortedSR.length;
  const paginatedSR = sortedSR.slice((srPage - 1) * srPageSize, srPage * srPageSize);
  const srStart = (srPage - 1) * srPageSize + 1;
  const srEnd = Math.min(srPage * srPageSize, totalSR);

  // Validation checklist for expanded request
  const getChecklist = (r) => {
    const base = [
      { label: 'ID verification complete', done: r.status !== 'Pending Approval' },
      { label: 'Work permit issued', done: r.status === 'Scheduled' || r.status === 'Completed' },
      { label: 'Resident approval received', done: r.status === 'Scheduled' || r.status === 'Completed' },
      { label: 'Safety briefing acknowledged', done: r.status === 'Completed' }
    ];
    return base;
  };

  return (
    <div>
      {/* Header */}
      <div className="page-header">
        <div>
          <h1>{t('pm.serviceRequestsTitle')}</h1>
          <div className="subtitle">{activeCount} active · {pendingCount} pending approval · {escalatedCount} escalated</div>
        </div>
        <div style={{display:'flex',gap:12,alignItems:'center'}}>
          <div style={{display:'flex',border:'1px solid #d5cfc8',borderRadius:6,overflow:'hidden'}}>
            {[t('pm.calendarView'),t('pm.listView')].map(v => (
              <button key={v} onClick={() => setViewMode(v)}
                style={{padding:'8px 20px',fontSize:13,fontWeight:viewMode===v?600:400,background:viewMode===v?'#1a1a1a':'#fff',color:viewMode===v?'#fff':'#1a1a1a',border:'none',cursor:'pointer'}}>
                {v}
              </button>
            ))}
          </div>
          <button className="btn btn-primary" onClick={()=>setShowNewRequest(true)}>{t('pm.newRequestBtn')}</button>
        </div>
      </div>

      {/* Main Grid: Calendar + Day View */}
      <div style={{display:'grid',gridTemplateColumns:'280px 1fr',gap:20}}>
        {/* Left: Calendar + Legend */}
        <div className="card">
          <MiniCalendar selectedDate={selectedDate} onDateSelect={setSelectedDate} eventDayMap={eventDayMap}/>
          <div style={{marginTop:16,fontSize:12}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><span style={{width:8,height:8,borderRadius:'50%',background:'#928989',display:'inline-block'}}/><span style={{color:'#1a1a1a'}}>{t('pm.legendMoveInOut')}</span></div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><span style={{width:8,height:8,borderRadius:'50%',background:'#8a8a8a',display:'inline-block'}}/><span style={{color:'#a89a92'}}>{t('pm.legendInstallation')}</span></div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><span style={{width:8,height:8,borderRadius:'50%',background:'#c0c0c0',display:'inline-block'}}/><span style={{color:'#a89a92'}}>{t('pm.legendHandymanMaint')}</span></div>
            <div style={{display:'flex',alignItems:'center',gap:8}}><span style={{width:8,height:8,borderRadius:'50%',background:'#e8e3de',display:'inline-block'}}/><span style={{color:'#a89a92'}}>{t('pm.legendPestOther')}</span></div>
          </div>
        </div>

        {/* Right: Day requests + expanded detail */}
        <div>
          <div className="card">
            <div className="card-header">
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <h3>{formatDate(selectedDate)} — {dayRequests.length} requests</h3>
                <input type="date" value={selectedDate instanceof Date ? selectedDate.toISOString().split('T')[0] : new Date(selectedDate).toISOString().split('T')[0]} onChange={e=>{ const d = new Date(e.target.value + 'T12:00:00'); if (!isNaN(d)) setSelectedDate(d); }} style={{padding:'6px 12px',border:'1px solid #d5cfc8',borderRadius:6,fontSize:13}}/>
              </div>
              <button className="btn btn-sm" style={{display:'flex',alignItems:'center',gap:4}}><Icon name="filter" size={12}/> {t('pm.filterBtn')}</button>
            </div>

            {dayRequests.map(r => (
              <div key={r.id}>
                {/* Request row */}
                <div style={{display:'flex',alignItems:'center',gap:16,padding:'14px 0',borderBottom: expandedSR?.id === r.id ? 'none' : '1px solid #f0f0f0',cursor:'pointer'}}
                  onClick={() => setExpandedSR(expandedSR?.id === r.id ? null : r)}>
                  <span style={{fontWeight:600,color:'#a89a92',minWidth:44,fontSize:13}}>{r.time}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,color:'#1a1a1a',fontSize:14}}>{r.type} <span style={{fontWeight:400,color:'#a89a92'}}>— {r.id}</span></div>
                    <div style={{fontSize:12,color:'#a89a92'}}>{r.flat} · {r.resident}</div>
                  </div>
                  <StatusBadge status={r.status}/>
                  <span style={{fontSize:11,color:'#a89a92',display:'flex',alignItems:'center',gap:4}}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    SLA: {r.sla}
                  </span>
                  <span style={{color:'#a89a92',fontSize:16,transform: expandedSR?.id === r.id ? 'rotate(180deg)' : 'rotate(0deg)',transition:'transform 0.2s'}}>∧</span>
                </div>

                {/* Expanded Detail */}
                {expandedSR?.id === r.id && (
                  <div style={{padding:'0 0 16px',borderBottom:'1px solid #ebe7e3'}}>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 280px',gap:16}}>
                      {/* Left: Detail Grid */}
                      <div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
                          <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:4}}>{t('pm.requestId')}</div><div style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>{r.id}</div></div>
                          <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:4}}>{t('pm.serviceType')}</div><div style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>{r.type}</div></div>
                          <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:4}}>{t('pm.flat')}</div><div style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>{r.flat}</div></div>
                          <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:4}}>{t('pm.residentCol')}</div><div style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>{r.resident}</div></div>
                          <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:4}}>SLA</div><div style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>{r.sla} {t('pm.fromApproval')}</div></div>
                          <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:4}}>Documents</div><div style={{fontSize:13,fontWeight:600,color:'#1a1a1a'}}>1 attached</div></div>
                        </div>

                        {/* Validation Checklist */}
                        <div style={{fontSize:12,fontWeight:600,color:'#1a1a1a',marginBottom:8}}>{t('pm.validationChecklist')}</div>
                        {getChecklist(r).map((c, ci) => (
                          <div key={ci} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                            {c.done ? (
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="4" fill="#1a1a1a"/><path d="M9 12l2 2 4-4" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                            ) : (
                              <div style={{width:16,height:16,border:'1.5px solid #d0d0d0',borderRadius:4}}/>
                            )}
                            <span style={{fontSize:12,color: c.done ? '#1a1a1a' : '#8a8a8a'}}>{c.label}</span>
                          </div>
                        ))}
                      </div>

                      {/* Right: Documents + Actions */}
                      <div style={{gridColumn:'3'}}>
                        <div style={{border:'1px solid #ebe7e3',borderRadius:6,padding:20,textAlign:'center',marginBottom:16}}>
                          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" strokeWidth="1.5" style={{marginBottom:8}}><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>
                          <div style={{fontSize:12,color:'#a89a92'}}>{t('pm.documentsLabel')} (1)</div>
                        </div>

                        <div style={{border:'1px solid #ebe7e3',borderRadius:6,padding:16,marginBottom:16}}>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                            <span style={{fontSize:12,fontWeight:600,color:'#1a1a1a'}}>{t('pm.residentApprovalLabel')}</span>
                          </div>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <span style={{fontSize:12,color:'#a89a92'}}>{t('pm.overrideApproval')}</span>
                            <div style={{width:36,height:20,borderRadius:10,background: r.status === 'Scheduled' || r.status === 'Completed' ? '#1a1a1a' : '#d0d0d0',position:'relative',cursor:'pointer'}}>
                              <div style={{width:16,height:16,borderRadius:'50%',background:'#fff',position:'absolute',top:2,left: r.status === 'Scheduled' || r.status === 'Completed' ? 18 : 2,transition:'left 0.2s'}}/>
                            </div>
                          </div>
                        </div>

                        <button className="btn btn-primary" style={{width:'100%',padding:'12px 0',fontSize:13,fontWeight:600}} onClick={()=>setShowSchedule(r)}>
                          {t('pm.reschedule')}
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ))}
            {dayRequests.length === 0 && <div style={{textAlign:'center',color:'#a89a92',padding:24,fontSize:13}}>{t('pm.noRequestsDate')}</div>}
          </div>

          {/* All Service Requests Table */}
          <div className="card">
            <div className="card-header">
              <h3>{t('pm.allServiceRequests')}</h3>
              <button className="btn btn-sm" onClick={handleExportSR} style={{display:'flex',alignItems:'center',gap:4}}>
                <Icon name="download" size={12}/> {t('pm.exportBtn')}
              </button>
            </div>
            <table className="data-table">
              <thead>
                <tr><th>{t('pm.idCol')}</th><th>{t('pm.serviceType')}</th><th>{t('pm.flat')}</th><th>{t('pm.residentCol')}</th><th>{t('pm.dateTimeCol')}</th><th>{t('pm.statusCol')}</th><th>SLA</th><th>{t('pm.tableHeaderActions')}</th></tr>
              </thead>
              <tbody>
                {paginatedSR.map(r => (
                  <tr key={r.id}>
                    <td style={{color:'#a89a92'}}>{r.id}</td>
                    <td><strong>{r.type}</strong></td>
                    <td>{r.flat}</td>
                    <td>{r.resident}</td>
                    <td>{r.date} · {r.time}</td>
                    <td><StatusBadge status={r.status}/></td>
                    <td style={{color:'#a89a92'}}>{r.sla || '4h'}</td>
                    <td>
                      <div style={{display:'flex',gap:6}}>
                        <button className="btn btn-sm" onClick={() => setExpandedSR(expandedSR?.id === r.id ? null : r)}>{t('pm.expandBtn')}</button>
                        <button className="btn btn-sm btn-primary" onClick={() => {
                          setData(prev => ({...prev, serviceRequests: prev.serviceRequests.map(sr => sr.id === r.id ? {...sr, status: 'Scheduled'} : sr)}));
                          showToast(r.id + ' ' + t('pm.approveBtn').toLowerCase());
                        }}>Approve</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            {/* Pagination */}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',fontSize:12,color:'#a89a92'}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span>Rows per page:</span>
                {[10,25,50].map(s => (
                  <span key={s} onClick={() => { setSrPageSize(s); setSrPage(1); }}
                    style={{padding:'4px 10px',border:'1px solid #d5cfc8',borderRadius:4,cursor:'pointer',background: srPageSize === s ? '#1a1a1a' : '#fff',color: srPageSize === s ? '#fff' : '#8a8a8a',fontWeight: srPageSize === s ? 600 : 400}}>
                    {s}
                  </span>
                ))}
              </div>
              <span>{srStart}–{srEnd} of {totalSR}</span>
            </div>
          </div>
        </div>
      </div>

      {/* Schedule Modal */}
      {showSchedule && (
        <div className="modal-overlay" onClick={()=>{setShowSchedule(null);setSelectedPersonnel(null);}}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:460}}>
            <div className="modal-header">
              <div><div className="modal-sub">modal/schedule · {showSchedule.id}</div><h2>{t('pm.scheduleServiceTitle')}</h2></div>
              <button className="modal-close" onClick={()=>{setShowSchedule(null);setSelectedPersonnel(null);}}>×</button>
            </div>
            <div style={{background:'#f2efec',borderRadius:6,padding:'14px 16px',marginBottom:20}}>
              <div style={{fontWeight:600,color:'#1a1a1a',fontSize:14}}>{showSchedule.type} — {showSchedule.flat}</div>
              <div style={{fontSize:12,color:'#a89a92',marginTop:2}}>{showSchedule.resident}</div>
            </div>
            <div style={{marginBottom:20}}>
              <label style={{fontSize:13,fontWeight:500,color:'#1a1a1a',display:'block',marginBottom:12}}>{t('pm.chooseServicePersonnel')}</label>
              {data.servicePersonnel.map(p => (
                <div key={p.id} onClick={() => setSelectedPersonnel(p.id)}
                  style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',border: selectedPersonnel === p.id ? '1.5px solid #1a1a1a' : '1px solid #e0e0e0',borderRadius:6,marginBottom:8,cursor:'pointer',background: selectedPersonnel === p.id ? '#f5f5f5' : '#fff',transition:'all 0.15s'}}>
                  <div style={{width:36,height:36,background: selectedPersonnel === p.id ? '#1a1a1a' : '#f0f0f0',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={selectedPersonnel === p.id ? '#fff' : '#8a8a8a'} strokeWidth="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:selectedPersonnel === p.id ? 600 : 500,color:'#1a1a1a',fontSize:13}}>{p.name}</div>
                    <div style={{fontSize:11,color:'#a89a92'}}>{p.specialty}</div>
                  </div>
                  {selectedPersonnel === p.id && (
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" strokeWidth="2.5"><path d="M20 6L9 17l-5-5"/></svg>
                  )}
                </div>
              ))}
            </div>
            <div className="form-group"><label style={{fontSize:13,fontWeight:500,color:'#1a1a1a'}}>b. {t('pm.scheduleServiceTitle')} Date</label><input className="form-input" type="date"/></div>
            <div className="form-group"><label style={{fontSize:13,fontWeight:500,color:'#1a1a1a'}}>c. {t('pm.scheduleServiceTitle')} Time</label><input className="form-input" type="time"/></div>
            <div className="grid-2" style={{marginTop:8}}>
              <button className="btn btn-primary" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6}} onClick={()=>{setShowSchedule(null);setSelectedPersonnel(null);showToast('Service scheduled!');}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                {t('pm.confirmSchedule')}
              </button>
              <button className="btn" onClick={()=>{setShowSchedule(null);setSelectedPersonnel(null);}}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* New Request Modal */}
      {showNewRequest && (
        <div className="modal-overlay" onClick={()=>setShowNewRequest(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}>
            <div className="modal-header">
              <div><div className="modal-sub">form/service-request/create</div><h2>{t('pm.createServiceRequestForm')}</h2></div>
              <button className="modal-close" onClick={()=>setShowNewRequest(false)}>×</button>
            </div>
            <div className="form-group"><label>{t('pm.flatUnitLabel')}</label><input className="form-input" placeholder="e.g. A-1204" value={newSR.flat} onChange={e=>setNewSR(p=>({...p,flat:e.target.value}))}/></div>
            <div className="form-group"><label>{t('pm.serviceTypeLabel')}</label><input className="form-input" placeholder="Move-In/Out, Installation, Handyman..." value={newSR.type} onChange={e=>setNewSR(p=>({...p,type:e.target.value}))}/></div>
            <div className="form-group"><label>{t('pm.requesterName')}</label><input className="form-input" placeholder="Resident or company name" value={newSR.resident} onChange={e=>setNewSR(p=>({...p,resident:e.target.value}))}/></div>
            <div className="form-group"><label>{t('pm.preferredDateTime')}</label><input className="form-input" placeholder="DD/MM/YYYY · HH:MM" value={newSR.dateTime} onChange={e=>setNewSR(p=>({...p,dateTime:e.target.value}))}/></div>
            <div className="form-group"><label>{t('pm.slaLabel')}</label><input className="form-input" placeholder="e.g. 4 hours" value={newSR.sla} onChange={e=>setNewSR(p=>({...p,sla:e.target.value}))}/></div>
            <div className="form-group"><label>{t('pm.notesLabel')}</label><input className="form-input" placeholder="Special instructions..." value={newSR.notes} onChange={e=>setNewSR(p=>({...p,notes:e.target.value}))}/></div>
            <div className="form-group"><label>{t('pm.attachmentsLabel')}</label><div className="upload-area">Drag & drop or click to upload</div></div>
            <div className="grid-2" style={{marginTop:8}}>
              <button className="btn btn-primary" onClick={handleCreateSR}>Create Request</button>
              <button className="btn" onClick={()=>setShowNewRequest(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ==================== ANNOUNCEMENTS PAGE ====================
const AnnouncementsPage = () => {
  const { data, setData, showToast, t } = useApp();
  const [filter, setFilter] = useState('All');
  const [showComposer, setShowComposer] = useState(false);
  const [composerStep, setComposerStep] = useState(1);
  const [showDelete, setShowDelete] = useState(null);
  const [editingAnn, setEditingAnn] = useState(null);
  const [annForm, setAnnForm] = useState({ title: '', body: '', priority: 'Normal', audience: 'All Residents', publishMode: 'now', ackRequired: false, scheduleDate: '', scheduleTime: '' });

  const resetForm = () => setAnnForm({ title: '', body: '', priority: 'Normal', audience: 'All Residents', publishMode: 'now', ackRequired: false, scheduleDate: '', scheduleTime: '' });

  const liveCount = data.announcements.filter(a => a.status === 'Live').length;
  const scheduledCount = data.announcements.filter(a => a.status === 'Scheduled').length;
  const draftCount = data.announcements.filter(a => a.status === 'Draft').length;
  const sentCount = data.announcements.filter(a => a.status === 'Sent').length;
  const filters = [{label:'All',count:data.announcements.length},{label:'Live',count:liveCount},{label:'Scheduled',count:scheduledCount},{label:'Draft',count:draftCount},{label:'Sent',count:sentCount}];
  const filtered = filter === 'All' ? data.announcements : data.announcements.filter(a => a.status === filter);

  const handlePublish = () => {
    if (!annForm.title.trim()) { showToast('Title is required'); return; }
    const now = new Date();
    const timeStr = formatTime24(now);
    const dateStr = formatDateShort(now);
    const status = annForm.publishMode === 'now' ? 'Live' : annForm.publishMode === 'schedule' ? 'Scheduled' : 'Draft';

    if (editingAnn) {
      setData(prev => ({
        ...prev,
        announcements: prev.announcements.map(a => a.id === editingAnn.id ? {
          ...a, title: annForm.title, audience: annForm.audience, priority: annForm.priority, ackRequired: annForm.ackRequired, status: status, body: annForm.body,
          scheduleDate: annForm.scheduleDate, scheduleTime: annForm.scheduleTime
        } : a)
      }));
      showToast('Announcement updated');
    } else {
      const newAnn = {
        id: Date.now(),
        title: annForm.title,
        body: annForm.body,
        audience: annForm.audience,
        author: data.currentUser.name,
        created: dateStr + ', ' + timeStr,
        status: status,
        priority: annForm.priority,
        ackRequired: annForm.ackRequired,
        delivered: status === 'Live' ? 1240 : 0,
        read: 0,
        acknowledged: 0,
        scheduleDate: annForm.scheduleDate,
        scheduleTime: annForm.scheduleTime
      };
      setData(prev => ({ ...prev, announcements: [newAnn, ...prev.announcements] }));
      showToast('Announcement ' + (status === 'Live' ? 'published — visible to residents now' : status === 'Scheduled' ? 'scheduled for ' + annForm.scheduleDate + ' ' + annForm.scheduleTime : 'saved as draft'));
    }
    setShowComposer(false);
    setEditingAnn(null);
    resetForm();
  };

  const handleDelete = (ann) => {
    if (window.confirm('Delete this announcement? This action cannot be undone.')) { setData(prev => ({ ...prev, announcements: prev.announcements.filter(a => a.id !== ann.id) })); }
    setShowDelete(null);
    showToast('Announcement deleted');
  };

  const handleEdit = (ann) => {
    setEditingAnn(ann);
    setAnnForm({ title: ann.title, body: ann.body || '', priority: ann.priority, audience: ann.audience, publishMode: ann.status === 'Scheduled' ? 'schedule' : ann.status === 'Draft' ? 'draft' : 'now', ackRequired: ann.ackRequired, scheduleDate: ann.scheduleDate || '', scheduleTime: ann.scheduleTime || '' });
    setComposerStep(1);
    setShowComposer(true);
  };

  // Simple toolbar button
  const ToolBtn = ({ children }) => (
    <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:32,height:32,border:'1px solid #d5cfc8',borderRadius:4,cursor:'pointer',fontSize:13,fontWeight:600,color:'#1a1a1a',background:'#fff'}}>{children}</span>
  );

  return (
    <div>
      <div className="page-header">
        <div><h1>{t('pm.announcementsTitle')}</h1><div className="subtitle">{liveCount} {t('pm.announcementLive')} · {scheduledCount} {t('pm.announcementScheduled')} · {draftCount} {t('pm.announcementDraft')} · {sentCount} {t('pm.announcementSent')}</div></div>
        <button className="btn btn-primary" onClick={()=>{resetForm();setEditingAnn(null);setShowComposer(true);setComposerStep(1)}}>{t('pm.newAnnouncementBtn')}</button>
      </div>
      <div className="filter-row">
        {filters.map(f => <span key={f.label} className={`chip ${filter===f.label?'active':''}`} onClick={()=>setFilter(f.label)}>{f.label} {f.count}</span>)}
      </div>
      {filtered.length === 0 && <div style={{textAlign:'center',color:'#a89a92',padding:40,fontSize:13}}>{t('pm.noAnnouncementsCat')}</div>}
      {filtered.map(a => (
        <div key={a.id} className="announcement-card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div style={{flex:1}}>
              <div className="tags">
                <StatusBadge status={a.status}/>
                {a.priority==='High' && <span style={{fontSize:11,color:'#8a7f76',border:'1px solid #d5cfc8',borderRadius:3,padding:'1px 8px'}}>△ {t('pm.markHighPriority')}</span>}
                {a.ackRequired && <span style={{fontSize:11,color:'#8a7f76',border:'1px solid #d5cfc8',borderRadius:3,padding:'1px 8px'}}>{t('pm.ackRequiredLabel')} {t('pm.requireAck')}</span>}
              </div>
              <h3 style={{fontSize:16,fontWeight:600,marginBottom:6}}>{a.title}</h3>
              {a.body && <p style={{fontSize:13,color:'#7a6f66',margin:'4px 0 8px',lineHeight:1.5}}>{a.body}</p>}
              <div className="meta">{t('pm.announceAudience')} <strong>{a.audience}</strong> &nbsp; {t('pm.announceBy')} {a.author} &nbsp; {t('pm.announceCreated')} {a.created}</div>
            </div>
            <div style={{display:'flex',gap:6,flexShrink:0,marginLeft:16}}>
              {a.status !== 'Sent' && a.status !== 'Live' && (
                <button className="btn btn-sm" onClick={()=>handleEdit(a)} style={{width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>
                  <Icon name="edit" size={14}/>
                </button>
              )}
              <button className="btn btn-sm" onClick={()=>setShowDelete(a)} style={{width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>
                <Icon name="trash" size={14}/>
              </button>
            </div>
          </div>
          {(a.delivered > 0 || a.read > 0) && (
            <div style={{display:'flex',gap:24,alignItems:'center',flexWrap:'wrap',marginTop:16,paddingTop:16,borderTop:'1px solid #f0f0f0'}}>
              <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em'}}>{t('pm.deliveredCol')}</div><div style={{fontWeight:600,fontSize:14}}>{a.delivered.toLocaleString()}</div></div>
              <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em'}}>{t('pm.readCol')}</div><div style={{fontWeight:600,fontSize:14}}>{a.read.toLocaleString()}</div></div>
              {a.acknowledged > 0 && <div><div style={{fontSize:10,color:'#a89a92',letterSpacing:'0.04em'}}>{t('pm.acknowledgedCol')}</div><div style={{fontWeight:600,fontSize:14}}>{a.acknowledged.toLocaleString()}</div></div>}
              {a.read > 0 && a.delivered > 0 && <div style={{flex:1,display:'flex',alignItems:'center',gap:8,minWidth:120}}>
                <div className="progress-bar"><div className="fill" style={{width:`${Math.round(a.read/a.delivered*100)}%`}}/></div>
                <span style={{fontSize:11,color:'#a89a92'}}>{Math.round(a.read/a.delivered*100)}% {t('pm.readRateLabel')}</span>
              </div>}
              <span style={{fontSize:11,color:'#a89a92'}}>{t('pm.announceAudit')}: {a.author} · {a.created}</span>
            </div>
          )}
        </div>
      ))}

      {/* Composer Modal */}
      {showComposer && (
        <div className="modal-overlay" onClick={()=>{setShowComposer(false);setEditingAnn(null)}}>
          <div className="modal" style={{maxWidth:620}} onClick={e=>e.stopPropagation()}>
            <div className="modal-header" style={{marginBottom:4}}>
              <div><div className="modal-sub" style={{fontSize:10,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:4}}>Announcement Composer</div><h2 style={{fontSize:22}}>{editingAnn ? t('pm.composerEditTitle') : t('pm.composerTitle')}</h2></div>
              <button className="modal-close" onClick={()=>{setShowComposer(false);setEditingAnn(null)}}>×</button>
            </div>

            {/* Wizard Steps — pill style matching Figma */}
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:24,fontSize:12}}>
              {[t('pm.composeStep'), t('pm.audienceStep'), t('pm.scheduleStep'), t('pm.previewStep')].map((s,i) => {
                const stepNum = i + 1;
                const isActive = composerStep === stepNum;
                const isCompleted = composerStep > stepNum;
                const circled = ['\u2460','\u2461','\u2462','\u2463'][i];
                return (
                  <React.Fragment key={s}>
                    {i > 0 && <span style={{color:'#d0d0d0',fontSize:11}}>›</span>}
                    <span onClick={() => { if (isCompleted || isActive) setComposerStep(stepNum); }}
                      style={{padding:'7px 16px',borderRadius:20,cursor: isActive || isCompleted ? 'pointer' : 'default',fontWeight: isActive ? 500 : 400,
                        background: isActive ? 'var(--bg-warm-dark)' : 'transparent',
                        color: isActive ? '#fff' : isCompleted ? 'var(--text-dark)' : 'var(--text-muted)',
                        border: isActive ? 'none' : '1px solid var(--border-light)',fontSize:12,letterSpacing:'0.02em',whiteSpace:'nowrap'}}>
                      {circled} {s}
                    </span>
                  </React.Fragment>
                );
              })}
            </div>

            {/* Step 1: Compose */}
            {composerStep===1 && (<div>
              <div style={{marginBottom:20}}>
                <label style={{fontSize:11,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',color:'#1a1a1a',display:'block',marginBottom:8}}>{t('pm.titleLabel')} *</label>
                <input className="form-input" placeholder="Announcement title" value={annForm.title} onChange={e => setAnnForm(p => ({...p, title: e.target.value}))} style={{padding:'12px 14px',fontSize:13}}/>
              </div>
              <div style={{marginBottom:20}}>
                <label style={{fontSize:11,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',color:'#1a1a1a',display:'block',marginBottom:8}}>{t('pm.bodyLabel')}</label>
                {/* Rich text toolbar */}
                <div style={{display:'flex',gap:4,marginBottom:8}}>
                  <ToolBtn>B</ToolBtn>
                  <ToolBtn><em>I</em></ToolBtn>
                  <ToolBtn><u>U</u></ToolBtn>
                  <ToolBtn>• List</ToolBtn>
                  <ToolBtn>Link</ToolBtn>
                </div>
                <textarea className="form-input" rows={4} placeholder="Write your announcement here..." value={annForm.body} onChange={e => setAnnForm(p => ({...p, body: e.target.value}))} style={{resize:'vertical',padding:'12px 14px',fontSize:13}}/>
              </div>
              <div style={{marginBottom:20}}>
