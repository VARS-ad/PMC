const UnitAttachmentsModal = ({ unit, buildingName, onClose }) => {
  const [attachments, setAttachments] = useState(null);
  const [uploadingKind, setUploadingKind] = useState(null);
  const [error, setError] = useState(null);

  const reload = async () => {
    if (!supabaseClient) return;
    const { data, error: e } = await supabaseClient.from('unit_attachments')
      .select('id,kind,filename,storage_path,created_at')
      .eq('unit_id', unit.id)
      .order('created_at', { ascending: false });
    if (e) setError(e.message); else { setAttachments(data || []); setError(null); }
  };
  useEffect(() => { reload(); }, [unit.id]);

  const handleUpload = async (kind, file) => {
    if (!file || !supabaseClient) return;
    setUploadingKind(kind); setError(null);
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = unit.id + '/' + kind + '-' + Date.now() + '-' + safeName;
    const { error: upErr } = await supabaseClient.storage.from('unit-attachments').upload(path, file);
    if (upErr) { setError('Upload failed: ' + upErr.message); setUploadingKind(null); return; }
    const { error: insErr } = await supabaseClient.from('unit_attachments').insert({
      unit_id: unit.id, kind, filename: file.name, storage_path: path,
    });
    if (insErr) setError('Metadata insert: ' + insErr.message);
    setUploadingKind(null);
    await reload();
  };

  const handleDelete = async (att) => {
    if (!supabaseClient) return;
    if (!window.confirm('Delete ' + att.filename + '?')) return;
    await supabaseClient.storage.from('unit-attachments').remove([att.storage_path]);
    await supabaseClient.from('unit_attachments').delete().eq('id', att.id);
    await reload();
  };

  const sections = [
    { kind: 'photo',      label: 'Photos',              accept: 'image/*',      multiple: true  },
    { kind: 'title_deed', label: 'Title Deed',          accept: '.pdf,image/*', multiple: false },
    { kind: 'layout',     label: 'Layout / Floor Plan', accept: '.pdf,image/*', multiple: false },
    { kind: 'other',      label: 'Other Documents',     accept: '*/*',          multiple: true  },
  ];

  const grouped = (attachments || []).reduce((acc, a) => {
    (acc[a.kind] = acc[a.kind] || []).push(a);
    return acc;
  }, {});

  return (
    <div className="modal-overlay" onClick={onClose} style={{zIndex:1100}}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{maxWidth:680,maxHeight:'85vh',overflowY:'auto'}}>
        <div className="modal-header">
          <div>
            <div style={{fontSize:10,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:4}}>Unit attachments</div>
            <h2>{unit.unit_number}</h2>
            <div className="modal-sub">{buildingName} · Floor {unit.floor}</div>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        {error && <div style={{padding:10,background:'#fdf2f1',color:'#8b4a42',borderRadius:6,fontSize:12,marginBottom:14}}>{error}</div>}
        {attachments === null ? (
          <div style={{padding:24,color:'var(--text-muted)',fontSize:13}}>Loading…</div>
        ) : (
          <div>
            {sections.map(s => (
              <UnitAttachmentSection key={s.kind} section={s} files={grouped[s.kind] || []} uploading={uploadingKind === s.kind} onUpload={handleUpload} onDelete={handleDelete}/>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

  );
};

async function deleteUsersViaFunction(profileIds) {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const headers = { 'Content-Type': 'application/json' };
  if (session && session.access_token) headers['Authorization'] = 'Bearer ' + session.access_token;
  const resp = await fetch(SUPABASE_URL + '/functions/v1/delete-user', {
    method: 'POST', headers,
    body: JSON.stringify({ profile_ids: profileIds }),
  });
  return resp.json();
}

const EditRecordModal = ({ kind, record, onClose, onSaved }) => {
  const initial = (() => {
    if (kind === 'building') return { name: record.name || '', address: record.address || '', notes: record.notes || '' };
    if (kind === 'resident') return { full_name: record.full_name || '', phone: record.phone || '' };
    return { full_name: record.full_name || '', phone: record.phone || '', shift: record.shift || 'Day' };
  })();
  const [form, setForm] = useState(initial);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const save = async () => {
    setBusy(true); setError(null);
    try {
      if (kind === 'building') {
        const { error: e } = await supabaseClient.from('buildings').update({
          name: form.name.trim(),
          address: form.address.trim() || null,
          notes: form.notes.trim() || null,
        }).eq('id', record.id);
        if (e) throw e;
      } else if (kind === 'resident' || kind === 'security') {
        const { error: e } = await supabaseClient.from('profiles').update({
          full_name: form.full_name.trim(),
          phone: form.phone.trim() || null,
        }).eq('id', record.id);
        if (e) throw e;
        if (kind === 'security' && form.shift !== record.shift) {
          const { error: se } = await supabaseClient.from('security_assignments').update({
            shift: form.shift,
          }).eq('profile_id', record.id);
          if (se) throw se;
        }
      }
      if (onSaved) onSaved();
      onClose();
    } catch (e) {
      setError(String(e.message || e));
    }
    setBusy(false);
  };

  return (
    <div className="modal-overlay" onClick={onClose} style={{zIndex:1050}}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{maxWidth:500}}>
        <div className="modal-header">

            <div style={{fontSize:10,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:4}}>Edit {kind}</div>

          <button className="modal-close" onClick={onClose}>×</button>
        </div>

          <div>
            <div style={{marginBottom:14}}><PCField label="Building name" required value={form.name} onChange={v => setForm(f => ({...f, name: v}))}/></div>
            <div style={{marginBottom:14}}><PCField label="Address" value={form.address} onChange={v => setForm(f => ({...f, address: v}))}/></div>
            <div style={{marginBottom:14}}><PCField label="Notes" value={form.notes} onChange={v => setForm(f => ({...f, notes: v}))} textarea/></div>
          </div>
        )}
        {kind === 'resident' && (
          <div>
            <div style={{marginBottom:14}}><PCField label="Full name" required value={form.full_name} onChange={v => setForm(f => ({...f, full_name: v}))}/></div>
            <div style={{marginBottom:14}}><PCField label="Phone" value={form.phone} onChange={v => setForm(f => ({...f, phone: v}))}/></div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:14,padding:10,background:'var(--bg-page)',borderRadius:6}}>Email, building, and unit cannot be changed here. Delete and re-add the resident to move them to a different unit.</div>
          </div>
        )}
        {kind === 'security' && (
          <div>
            <div style={{marginBottom:14}}><PCField label="Full name" required value={form.full_name} onChange={v => setForm(f => ({...f, full_name: v}))}/></div>
            <div style={{marginBottom:14}}><PCField label="Phone" value={form.phone} onChange={v => setForm(f => ({...f, phone: v}))}/></div>
            <div style={{marginBottom:14}}><PCSelect label="Shift" value={form.shift} onChange={v => setForm(f => ({...f, shift: v}))} options={[{value:'Day',label:'Day'},{value:'Night',label:'Night'},{value:'24h',label:'24h'}]}/></div>

// ==================== UPCOMING PRE-APPROVALS (security dashboard) ====================
// Shown to security users (authenticated via Supabase Auth) on their dashboard.
// Pulls live from the new `visits` table — independent of the legacy JSON blob.

const UpcomingVisitsPanel = () => {
  const [visits, setVisits] = useState(null);
  const [hasAuth, setHasAuth] = useState(null);

  useEffect(() => {
    if (!supabaseClient) { setHasAuth(false); return; }
    let mounted = true;
    let channel = null;
    const load = async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!mounted) return;
      if (!session || !session.user) { setHasAuth(false); return; }
      setHasAuth(true);
      const today = new Date().toISOString().slice(0, 10);
      const { data, error } = await supabaseClient
        .from('visits')
        .select('id,visitor_name,visitor_phone,type,visit_date,visit_time,status,permit_ref')
        .eq('status', 'Pre-Approved')
        .gte('visit_date', today)
        .order('visit_date', { ascending: true });
      if (mounted && !error) setVisits(data || []);
    };
    load();
    // Supabase Realtime — sub-second updates on any visits change (RLS still applies).
    try {
      channel = supabaseClient
        .channel('visits-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'visits' }, () => load())
        .subscribe();
    } catch (_) { /* fall back to polling if realtime unavailable */ }
    // Slow fallback poll (15s) in case the realtime channel drops
    const id = setInterval(load, 15000);
    return () => {
      mounted = false;
      clearInterval(id);
      if (channel) { try { supabaseClient.removeChannel(channel); } catch(_) {} }
    };
  }, []);

  if (hasAuth === null) return null;
  if (!hasAuth || visits === null) return null;

  return (
    <div className="sec-kpi-block" style={{marginBottom:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,paddingBottom:10,borderBottom:'1px solid var(--border-light)'}}>
        <div>
          <div className="sec-kpi-label" style={{marginBottom:4}}>UPCOMING PRE-APPROVALS</div>
          <div style={{fontSize:10,color:'#a89a92'}}>Live from new visits table · realtime stream + 15s fallback</div>
        </div>
        <div style={{fontSize:24,fontWeight:700,color:'#1a1a1a'}}>{visits.length}</div>
      </div>
      {visits.length === 0 ? (
        <div style={{fontSize:12,color:'var(--text-muted)',padding:'14px 0',textAlign:'center'}}>No upcoming pre-approvals.</div>
      ) : (
        <div style={{maxHeight:280,overflowY:'auto'}}>
          {visits.map(v => (
            <div key={v.id} style={{padding:'10px 12px',background:'#e8e3de',borderRadius:6,marginBottom:6,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{minWidth:0,flex:1}}>
                <div style={{fontSize:13,fontWeight:500,color:'#1a1a1a'}}>{v.visitor_name}</div>
                <div style={{fontSize:11,color:'#6b6156',marginTop:2}}>
                  {v.visit_date}{v.visit_time ? ' · ' + v.visit_time : ''} · {v.type}{v.visitor_phone ? ' · ' + v.visitor_phone : ''}
                </div>
              </div>
              <div style={{fontSize:10,color:'#928989',background:'#fff',padding:'4px 8px',borderRadius:4,marginLeft:8,flexShrink:0}}>
                {v.permit_ref || '—'}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

const PMCOverviewPage = ({ setPage }) => {
  const { selectedProperties = [] } = useApp();
  const [stats, setStats] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let mounted = true;
    setStats(null); setError(null);
    (async () => {
      if (!supabaseClient) { setError('Supabase not initialized'); return; }
      try {
        const filterB = selectedProperties.length > 0 ? selectedProperties : null;
        const { data: buildings } = await supabaseClient.from('buildings').select('id,name');
        const { data: units } = await supabaseClient.from('units').select('id,building_id,unit_number,floor');
        const filteredUnits = (units || []).filter(u => !filterB || filterB.includes(u.building_id));
        const fIds = filteredUnits.map(u => u.id);
        const probe = fIds.length ? fIds : ['00000000-0000-0000-0000-000000000000'];

        const [{ data: ras }, { data: invoices }, { data: srs }, { data: visits }] = await Promise.all([
          supabaseClient.from('resident_assignments').select('profile_id,unit_id').in('unit_id', probe),
          supabaseClient.from('invoices').select('id,amount_aed,status,due_date,unit_id').in('unit_id', probe),
          supabaseClient.from('service_requests').select('id,category,description,status,priority,created_at,unit_id,resident_profile_id').in('unit_id', probe).order('created_at', { ascending: false }),
          supabaseClient.from('visits').select('id,visit_date,status,visitor_name,type').in('unit_id', probe),
        ]);
        if (!mounted) return;

        const today = new Date().toISOString().slice(0,10);
        const todaySRs = (srs || []).filter(s => (s.created_at || '').slice(0,10) === today).length;
        const overdueAmt = (invoices || []).filter(i => i.status === 'Overdue').reduce((s, i) => s + Number(i.amount_aed), 0);
        const upcomingVisits = (visits || []).filter(v => v.visit_date > today && v.status === 'Pre-Approved').length;
        const todayVisits = (visits || []).filter(v => v.visit_date === today).length;
        const totalUnits = filteredUnits.length;
        const occupied = new Set((ras || []).map(r => r.unit_id)).size;
        const occupancyRate = totalUnits > 0 ? Math.round((occupied / totalUnits) * 100) : 0;

        // SR status distribution
        const srStatusCounts = { open: 0, inProgress: 0, scheduled: 0, completed: 0 };
        (srs || []).forEach(s => {
          if (s.status === 'New' || s.status === 'Acknowledged') srStatusCounts.open++;
          else if (s.status === 'In Progress') srStatusCounts.inProgress++;
          else if (s.preferred_date && new Date(s.preferred_date) > new Date()) srStatusCounts.scheduled++;
          else if (s.status === 'Done' || s.status === 'Closed') srStatusCounts.completed++;
          else srStatusCounts.open++;
        });

        // Recent SRs needing action (Open / Acknowledged / In Progress)
        const srNeedingAction = (srs || []).filter(s => ['New','Acknowledged','In Progress'].includes(s.status)).slice(0, 5);

        // Service charge collection
        const totalBilled = (invoices || []).reduce((s, i) => s + Number(i.amount_aed), 0);
        const totalCollected = (invoices || []).filter(i => i.status === 'Paid').reduce((s, i) => s + Number(i.amount_aed), 0);
        const outstanding = totalBilled - totalCollected;
        const collectionRate = totalBilled > 0 ? Math.round((totalCollected / totalBilled) * 100) : 0;

        // Units in arrears — group overdue invoices by unit
        const arrearsByUnit = {};
        (invoices || []).filter(i => i.status === 'Overdue').forEach(i => {
          if (!arrearsByUnit[i.unit_id]) arrearsByUnit[i.unit_id] = { unit_id: i.unit_id, amount: 0, count: 0, oldest_due: null };
          arrearsByUnit[i.unit_id].amount += Number(i.amount_aed);
          arrearsByUnit[i.unit_id].count++;
          if (!arrearsByUnit[i.unit_id].oldest_due || (i.due_date && i.due_date < arrearsByUnit[i.unit_id].oldest_due)) {
            arrearsByUnit[i.unit_id].oldest_due = i.due_date;
          }
        });
        const uMap = Object.fromEntries(filteredUnits.map(u => [u.id, u]));
        const bMap = Object.fromEntries((buildings || []).map(b => [b.id, b]));
        const arrearsList = Object.values(arrearsByUnit).map(a => {
          const u = uMap[a.unit_id];
          return {
            ...a,
            unit_number: u ? u.unit_number : '—',
            floor: u ? u.floor : null,
            building_name: u && bMap[u.building_id] ? bMap[u.building_id].name : '—',
            building_letter: u && bMap[u.building_id] ? bMap[u.building_id].name.slice(0, 1).toUpperCase() : '?',
          };
        }).sort((a, b) => b.amount - a.amount).slice(0, 4);

        setStats({
          todaySRs, overdueAmt, upcomingVisits, todayVisits,
          occupancyRate, occupied, totalUnits,
          recentSRs: (srs || []).slice(0, 10),
          srNeedingAction, srStatusCounts,
          totalBilled, totalCollected, outstanding, collectionRate,
          arrearsList,
          totalUnitsInArrears: Object.keys(arrearsByUnit).length,
          totalArrears: Object.values(arrearsByUnit).reduce((s, a) => s + a.amount, 0),
          uMap, bMap,
        });
      } catch (e) {
        if (mounted) setError(String(e.message || e));
      }
    })();
    return () => { mounted = false; };
  }, [selectedProperties.join(',')]);

  const fmt = (n) => 'AED ' + Math.round(n).toLocaleString();

  if (error) return (<div><div className="page-header"><h1>PM Dashboard — Overview</h1></div><div className="card"><div style={{color:'#8b4a42',fontSize:13}}>{error}</div></div></div>);

  const statusBadge = (s) => {
    const c = ({
      'New':         { bg: '#f5f3f0', fg: '#7a6e60' },
      'Acknowledged':{ bg: '#e8e3de', fg: '#4a4540' },
      'In Progress': { bg: '#a07d3c', fg: '#fff' },
      'Done':        { bg: '#e6efe1', fg: '#5a6b4f' },
      'Closed':      { bg: '#ccc8c1', fg: '#4a4540' },
      'Rejected':    { bg: '#fdf2f1', fg: '#8b4a42' },
    })[s] || { bg: '#f5f3f0', fg: '#888' };
    return <span style={{padding:'3px 10px',borderRadius:4,fontSize:11,fontWeight:500,background:c.bg,color:c.fg}}>{s}</span>;
  };

  const daysOverdue = (d) => {
    if (!d) return 0;
    const diff = Math.floor((Date.now() - new Date(d).getTime()) / (1000 * 60 * 60 * 24));
    return diff > 0 ? diff : 0;
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>PM Dashboard — Overview</h1>
          <div className="subtitle">
            {selectedProperties.length > 0
              ? 'Scoped to ' + selectedProperties.length + ' building' + (selectedProperties.length === 1 ? '' : 's') + ' (top-bar selector) · live from Supabase'
              : 'All buildings · live from Supabase'}
          </div>
        </div>
      </div>

      {!stats ? (
        <div className="card"><div style={{padding:24,color:'var(--text-muted)',fontSize:13}}>Loading…</div></div>
      ) : (<>
        {/* KPI cards row — 6 wide */}
        <div style={{fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--text-secondary)',margin:'8px 0 10px',fontWeight:500}}>Key Performance Indicators</div>
        <div className="kpi-row" style={{marginBottom:28}}>
          {[
            { label: 'Service Requests Today', value: stats.todaySRs, page: 'service' },
            { label: 'Service Charge Arrears', value: fmt(stats.overdueAmt), page: 'payment' },
            { label: 'Upcoming Visitors',      value: stats.upcomingVisits, page: 'visitors' },
            { label: 'Visitors Today',         value: stats.todayVisits, page: 'visitors' },
            { label: 'Occupancy Rate',         value: stats.occupancyRate + '%', page: 'properties' },
            { label: 'Units Occupied',         value: stats.occupied + ' / ' + stats.totalUnits, page: 'properties' },
          ].map((k, i) => (
            <div key={i} className="kpi-card" style={{cursor:'pointer'}} onClick={() => setPage && setPage(k.page)}>
              <div className="label">{k.label}</div>

              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>

              </div>
              {(() => {
                const c = stats.srStatusCounts;
                const total = Math.max(c.open + c.inProgress + c.scheduled + c.completed, 1);
                return (<>

// ==================== PMC PROPERTIES PAGE ====================
// Replaces the legacy blank-ish PropertiesPage. Each card aggregates:
// units count · occupancy · residents · monthly revenue · collected · outstanding · open SRs.
// Click a card → BuildingDetailModal (reused from Profile Creation).

const PMCPropertiesPage = ({ setPage }) => {
  const { selectedProperties = [] } = useApp();
  const [buildings, setBuildings] = useState(null);
  const [error, setError] = useState(null);
  const [selectedBuilding, setSelectedBuilding] = useState(null);
  const [drill, setDrill] = useState(null); // { building, view }

  useEffect(() => {
    let mounted = true;
    setBuildings(null);
    (async () => {
      if (!supabaseClient) { setError('Supabase not initialized'); return; }
      try {
        const [{ data: bs }, { data: units }, { data: ras }, { data: invoices }, { data: srs }, { data: profiles }] = await Promise.all([
          supabaseClient.from('buildings').select('id,name,address,notes,created_at').order('name'),
          supabaseClient.from('units').select('id,building_id,floor,unit_number'),
          supabaseClient.from('resident_assignments').select('profile_id,unit_id,tenure,monthly_payment_aed,lease_start,lease_end,ownership_start'),
          supabaseClient.from('invoices').select('id,invoice_number,description,amount_aed,due_date,status,source_type,unit_id,resident_profile_id,created_at'),
          supabaseClient.from('service_requests').select('id,category,description,status,priority,created_at,unit_id,resident_profile_id,preferred_date'),
          supabaseClient.from('profiles').select('id,full_name,phone'),
        ]);
        if (!mounted) return;
        const profileMap = Object.fromEntries((profiles || []).map(p => [p.id, p]));
        const filterB = selectedProperties.length > 0 ? selectedProperties : null;
        const result = (bs || []).filter(b => !filterB || filterB.includes(b.id)).map(b => {
          const bUnits = (units || []).filter(u => u.building_id === b.id);
          const unitMap = Object.fromEntries(bUnits.map(u => [u.id, u]));
          const unitIds = bUnits.map(u => u.id);
          const occupied = (ras || [])
            .filter(r => unitIds.includes(r.unit_id))
            .map(r => ({
              ...r,
              resident_name: profileMap[r.profile_id]?.full_name || '—',
              resident_phone: profileMap[r.profile_id]?.phone || null,
              unit_number: unitMap[r.unit_id]?.unit_number || '—',
              floor: unitMap[r.unit_id]?.floor ?? null,
            }));
          const tenants = occupied.filter(o => o.tenure === 'Tenant');
          const monthlyRev = tenants.reduce((s, t) => s + Number(t.monthly_payment_aed || 0), 0);
          const bInvoices = (invoices || [])
            .filter(i => unitIds.includes(i.unit_id))
            .map(i => ({
              ...i,
              resident_name: i.resident_profile_id && profileMap[i.resident_profile_id] ? profileMap[i.resident_profile_id].full_name : '—',
              unit_number: unitMap[i.unit_id]?.unit_number || '—',
            }));
          const collected = bInvoices.filter(i => i.status === 'Paid').reduce((s, i) => s + Number(i.amount_aed), 0);
          const outstanding = bInvoices.filter(i => i.status === 'Pending' || i.status === 'Overdue').reduce((s, i) => s + Number(i.amount_aed), 0);
          const bSRs = (srs || [])
            .filter(s => unitIds.includes(s.unit_id))
            .map(s => ({
              ...s,
              resident_name: s.resident_profile_id && profileMap[s.resident_profile_id] ? profileMap[s.resident_profile_id].full_name : '—',
              unit_number: unitMap[s.unit_id]?.unit_number || '—',
            }));
          const openSRs = bSRs.filter(s => ['New','Acknowledged','In Progress'].includes(s.status)).length;
          return {
            ...b,
            units: bUnits,
            assignments: occupied, // alias for residents
            tenants, // resident_assignments filtered to Tenant
            invoices: bInvoices,
            srs: bSRs,
            unitCount: bUnits.length, occupiedCount: occupied.length,
            monthlyRev, collected, outstanding, openSRs, totalSRs: bSRs.length,
          };
        });
        setBuildings(result);
      } catch (e) { if (mounted) setError(String(e.message || e)); }
    })();
    return () => { mounted = false; };
  }, [selectedProperties.join(',')]);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Properties</h1>
          <div className="subtitle">Buildings under management. Use the top-bar property selector to focus on specific assets.</div>
        </div>
      </div>

      {error && <div className="card"><div style={{color:'#8b4a42',fontSize:13}}>{error}</div></div>}
      {buildings === null ? (
        <div className="card"><div style={{padding:24,color:'var(--text-muted)',fontSize:13}}>Loading…</div></div>
      ) : buildings.length === 0 ? (
        <div className="card"><div style={{padding:32,color:'var(--text-muted)',fontSize:13,textAlign:'center'}}>No buildings in your portfolio yet. Add some via <strong>Profile Creation → Buildings</strong>.</div></div>
      ) : (
        <>
          {/* Active properties — side by side */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(440px, 1fr))',gap:18}}>
            {buildings.map(b => {
              const occupancyPct = b.unitCount > 0 ? Math.round((b.occupiedCount / b.unitCount) * 100) : 0;
              const totalBilled = b.collected + b.outstanding;
              const open = () => setSelectedBuilding(b);
              return (
                <div key={b.id} className="card">
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                    <div style={{flex:1,minWidth:0,cursor:'pointer'}} onClick={open}>
                      <div style={{fontSize:18,fontWeight:600,color:'var(--text-dark)'}}>{b.name}</div>
                      <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{b.address || '—'}</div>
                    </div>
                    <div onClick={open} style={{cursor:'pointer',fontSize:12,fontWeight:500,color:occupancyPct >= 80 ? '#5a6b4f' : occupancyPct >= 50 ? 'var(--text-secondary)' : '#8b4a42',padding:'6px 14px',background:'var(--bg-surface)',borderRadius:4,whiteSpace:'nowrap',marginLeft:10,border:'1px solid var(--border-light)'}}>{occupancyPct}% occupied</div>
                  </div>
                  {b.notes && <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:14,padding:'10px 12px',background:'var(--bg-page)',borderRadius:6,lineHeight:1.5}}>{b.notes}</div>}
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(130px, 1fr))',gap:10}}>
                    <PMCStat label="Units"             value={b.unitCount}                                                  onClick={open}                                                  hint="View floors & units"/>
                    <PMCStat label="Occupied"          value={b.occupiedCount}                                              onClick={() => setDrill({ building: b, view: 'residents' })}      hint="Residents in this property"/>
                    <PMCStat label="Monthly Run-Rate"  value={'AED ' + Math.round(b.monthlyRev).toLocaleString()}          onClick={() => setDrill({ building: b, view: 'tenants' })}        hint="Tenants + lease rates"/>
                    <PMCStat label="Total Billed"      value={'AED ' + Math.round(totalBilled).toLocaleString()}           onClick={() => setDrill({ building: b, view: 'invoices' })}       hint="All invoices for this building"/>
                    <PMCStat label="Collected"         value={'AED ' + Math.round(b.collected).toLocaleString()}           onClick={() => setDrill({ building: b, view: 'collected' })}      color="#5a6b4f" hint="Paid invoices only"/>
                    <PMCStat label="Outstanding"       value={'AED ' + Math.round(b.outstanding).toLocaleString()}         onClick={() => setDrill({ building: b, view: 'outstanding' })}    color={b.outstanding > 0 ? '#8b4a42' : null} hint="Pending + Overdue"/>
                    <PMCStat label="Open SRs"          value={b.openSRs + ' open · ' + b.totalSRs + ' total'}              onClick={() => setDrill({ building: b, view: 'srs' })}            hint="Service requests for this building"/>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Coming soon — separate section below the active properties */}
          <div style={{marginTop:36}}>
            <div style={{fontSize:11,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-secondary)',marginBottom:6,fontWeight:600}}>Coming Soon</div>
            <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:16}}>Asset types currently under development that will appear in this view once onboarded.</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(320px, 1fr))',gap:14}}>
              {COMING_SOON_PROPERTIES.map(cs => (
                <div key={cs.id} className="card" style={{opacity:0.85,position:'relative',background:'var(--bg-surface)'}}>
                  <div style={{position:'absolute',top:14,right:14,fontSize:10,fontWeight:600,color:'#fff',background:'#928989',padding:'4px 12px',borderRadius:4,letterSpacing:'0.04em'}}>COMING SOON</div>
                  <div style={{fontSize:16,fontWeight:600,color:'var(--text-secondary)',marginBottom:4}}>{cs.name}</div>
                  <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:14}}>{cs.location}</div>
                  <div style={{fontSize:11,color:'var(--text-muted)',lineHeight:1.5,padding:'10px 12px',background:'#fff',borderRadius:6,border:'1px dashed var(--border-light)'}}>
                    {cs.id === 'soon-commercial'
                      ? 'Mixed-use commercial plots: retail, office, F&B. Onboarding workflow under development.'
                      : 'Low-rise villa compounds with private gardens. Onboarding workflow under development.'}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}

      {selectedBuilding && <BuildingDetailModal building={selectedBuilding} onClose={() => setSelectedBuilding(null)}/>}
    </div>
  );
};

const PMCServiceRequestsPage = () => {
  const { selectedProperties = [] } = useApp();
  const [rows, setRows] = useState(null);
  const [error, setError] = useState(null);
  const [statusFilter, setStatusFilter] = useState('all');
  const [priorityFilter, setPriorityFilter] = useState('all');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [search, setSearch] = useState('');
  const [selectedSR, setSelectedSR] = useState(null);
  const [showExport, setShowExport] = useState(false);

  useEffect(() => {
    let mounted = true;
    setRows(null);
    (async () => {
      if (!supabaseClient) { setError('Supabase not initialized'); return; }
      try {
        const filterB = selectedProperties.length > 0 ? selectedProperties : null;
        const { data: units } = await supabaseClient.from('units').select('id,building_id,unit_number,floor');
        const filteredUnits = (units || []).filter(u => !filterB || filterB.includes(u.building_id));
        const fIds = filteredUnits.map(u => u.id);
        const probe = fIds.length ? fIds : ['00000000-0000-0000-0000-000000000000'];
        const [{ data: srs }, { data: bs }, { data: profs }] = await Promise.all([
          supabaseClient.from('service_requests').select('id,category,description,priority,status,preferred_date,preferred_time,unit_id,resident_profile_id,resolved_at,notes,created_at,updated_at').in('unit_id', probe).order('created_at', { ascending: false }),
          supabaseClient.from('buildings').select('id,name'),
          supabaseClient.from('profiles').select('id,full_name').eq('role', 'resident'),
        ]);
        if (!mounted) return;
        const uMap = Object.fromEntries(filteredUnits.map(u => [u.id, u]));
        const bMap = Object.fromEntries((bs || []).map(b => [b.id, b]));
        const pMap = Object.fromEntries((profs || []).map(p => [p.id, p]));
        setRows((srs || []).map(s => {
          const u = uMap[s.unit_id];
          return {
            ...s,
            unit_number: u ? u.unit_number : '—',
            floor: u ? u.floor : null,
            building_id: u ? u.building_id : null,
            building_name: u && bMap[u.building_id] ? bMap[u.building_id].name : '—',
            resident_name: s.resident_profile_id && pMap[s.resident_profile_id] ? pMap[s.resident_profile_id].full_name : '—',
          };
        }));
      } catch (e) { if (mounted) setError(String(e.message || e)); }
    })();
    return () => { mounted = false; };
  }, [selectedProperties.join(',')]);

  const filtered = (rows || []).filter(s => {
    if (statusFilter !== 'all' && s.status !== statusFilter) return false;
    if (priorityFilter !== 'all' && s.priority !== priorityFilter) return false;
    if (categoryFilter !== 'all' && s.category !== categoryFilter) return false;
    if (dateFrom && (s.created_at || '').slice(0,10) < dateFrom) return false;
    if (dateTo && (s.created_at || '').slice(0,10) > dateTo) return false;
    if (search) {
      const hay = ((s.category || '') + ' ' + (s.description || '') + ' ' + (s.resident_name || '') + ' ' + (s.unit_number || '')).toLowerCase();
      if (!hay.includes(search.toLowerCase())) return false;
    }
    return true;
  });

  const categories = [...new Set((rows || []).map(s => s.category))].sort();

  const counts = {
    total: filtered.length,
    open:        filtered.filter(s => ['New','Acknowledged','In Progress'].includes(s.status)).length,
    inProgress:  filtered.filter(s => s.status === 'In Progress').length,
    done:        filtered.filter(s => s.status === 'Done' || s.status === 'Closed').length,
    urgent:      filtered.filter(s => s.priority === 'Urgent' && !['Done','Closed'].includes(s.status)).length,
  };

  const exportTo = (format) => {
    setShowExport(false);
    // Stub: real generation TBD. Provide CSV stub right here.
    if (format === 'CSV') {
      const headers = ['ID','Category','Description','Priority','Status','Building','Unit','Resident','Preferred date','Created'];
      const lines = [headers.join(',')].concat(filtered.map(s => [
        s.id, s.category, '"' + (s.description || '').replace(/"/g, '""') + '"', s.priority, s.status, s.building_name, s.unit_number, s.resident_name, s.preferred_date || '', s.created_at || ''
      ].join(',')));
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'service-requests-' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return;
    }
    alert('Export → ' + format + '\n\n' + filtered.length + ' rows ready. File generation gateway is under development — coming soon.');
  };

  const statusBadge = (s) => {
    const c = ({
      'New':         { bg: '#f5f3f0', fg: '#7a6e60' },
      'Acknowledged':{ bg: '#e8e3de', fg: '#4a4540' },
      'In Progress': { bg: '#a07d3c', fg: '#fff' },
      'Done':        { bg: '#e6efe1', fg: '#5a6b4f' },
      'Closed':      { bg: '#ccc8c1', fg: '#4a4540' },
      'Rejected':    { bg: '#fdf2f1', fg: '#8b4a42' },
    })[s] || { bg: '#f5f3f0', fg: '#888' };
    return <span style={{padding:'3px 10px',borderRadius:4,fontSize:11,fontWeight:500,background:c.bg,color:c.fg}}>{s}</span>;
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Service Requests</h1>
          <div className="subtitle">All maintenance + service tickets across selected properties. Click a row for details.</div>
        </div>
        <div style={{position:'relative'}}>
          <button className="btn btn-primary" onClick={() => setShowExport(!showExport)}>Export ▾</button>
          {showExport && (
            <>
              <div onClick={() => setShowExport(false)} style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:899}}/>
              <div style={{position:'absolute',right:0,top:'100%',marginTop:6,minWidth:200,background:'#fff',border:'1px solid var(--border-light)',borderRadius:8,boxShadow:'0 8px 24px rgba(0,0,0,0.1)',zIndex:900,overflow:'hidden'}}>
                {['PDF','Word','CSV','Excel'].map(f => (
                  <div key={f} onClick={() => exportTo(f)} style={{padding:'12px 16px',cursor:'pointer',fontSize:13,borderBottom:'1px solid var(--border-light)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--bg-page)'} onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
                    Export as {f}
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      </div>

      <div className="kpi-row">
        <div className="kpi-card"><div className="label">Total</div><div className="value">{counts.total}</div></div>
        <div className="kpi-card"><div className="label">Open</div><div className="value" style={{color:'#a07d3c'}}>{counts.open}</div></div>
        <div className="kpi-card"><div className="label">In Progress</div><div className="value">{counts.inProgress}</div></div>
        <div className="kpi-card"><div className="label">Done / Closed</div><div className="value" style={{color:'#5a6b4f'}}>{counts.done}</div></div>
        <div className="kpi-card"><div className="label">Urgent open</div><div className="value" style={{color:'#8b4a42'}}>{counts.urgent}</div></div>
      </div>

      <div className="card">

// ==================== CHART HELPER (Chart.js wrapper) ====================
// Renders a Chart.js chart and tears it down when the config changes or the
// component unmounts. Hover tooltips + legend are interactive out of the box.

const ChartCanvas = ({ config, height }) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!window.Chart || !canvasRef.current) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    try {
      chartRef.current = new window.Chart(canvasRef.current, config);
    } catch (e) { /* fail silently */ }
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [JSON.stringify(config)]);
  return (
    <div style={{position:'relative',width:'100%',height: height || 280}}>
      <canvas ref={canvasRef}/>
    </div>
  );
};

function buildMonthlyBuckets(months = 12) {
  const today = new Date();
  const out = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    out.push({
      key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
      label: d.toLocaleDateString('en', { month: 'short', year: '2-digit' }),
    });
  }
  return out;
}

    const d = new Date();
    if (timeRange === '3m') d.setMonth(d.getMonth() - 3);
    else if (timeRange === '6m') d.setMonth(d.getMonth() - 6);
    else if (timeRange === '12m') d.setMonth(d.getMonth() - 12);
    else if (timeRange === '24m') d.setMonth(d.getMonth() - 24);
    else if (timeRange === 'ytd') { d.setMonth(0); d.setDate(1); }
    else return null;
    return d.toISOString().slice(0, 10);
  })();
  const monthCount = timeRange === '3m' ? 3
                  : timeRange === '6m' ? 6
                  : timeRange === '24m' ? 24
                  : timeRange === 'ytd' ? new Date().getMonth() + 1
                  : 12;

    let mounted = true;

          supabaseClient.from('invoices').select('amount_aed,status,due_date,source_type,created_at').in('unit_id', probeIds),

        // Apply time-range cutoff to relevant time-bound datasets

        const cutSRs = cutoff ? (srs || []).filter(s => (s.created_at || '').slice(0, 10) >= cutoff) : (srs || []);

        const cutBookings = cutoff ? (bookings || []).filter(b => (b.booking_date || b.created_at || '').slice(0, 10) >= cutoff) : (bookings || []);

        const vacant = Math.max(totalUnits - occupiedUnits, 0);
        const owners = (ras || []).filter(r => r.tenure === 'Owner').length;

        const pending = cutInv.filter(i => i.status === 'Pending').reduce((s, i) => s + Number(i.amount_aed), 0);
        const overdue = cutInv.filter(i => i.status === 'Overdue').reduce((s, i) => s + Number(i.amount_aed), 0);
        const collectionRate = totalInvoiced > 0 ? Math.round((collected / totalInvoiced) * 100) : 0;

        const today = new Date(); today.setHours(0,0,0,0);
        const in90 = new Date(today); in90.setDate(in90.getDate() + 90);
        const leasesExpSoon = (ras || []).filter(r => r.lease_end && new Date(r.lease_end) <= in90 && new Date(r.lease_end) >= today).length;
        const leasesExpired = (ras || []).filter(r => r.lease_end && new Date(r.lease_end) < today).length;

        const srByStatus = {};
        cutSRs.forEach(s => { srByStatus[s.status] = (srByStatus[s.status] || 0) + 1; });
        const srByCategory = {};
        cutSRs.forEach(s => { srByCategory[s.category] = (srByCategory[s.category] || 0) + 1; });
        const srByPriority = {};
        cutSRs.forEach(s => { srByPriority[s.priority] = (srByPriority[s.priority] || 0) + 1; });
        const openSRs = ['New','Acknowledged','In Progress'].reduce((acc, k) => acc + (srByStatus[k] || 0), 0);
        const closedSRs = ['Done','Closed'].reduce((acc, k) => acc + (srByStatus[k] || 0), 0);

        const visitsByType = {};
        cutVisits.forEach(v => { visitsByType[v.type] = (visitsByType[v.type] || 0) + 1; });
        const visitsByStatus = {};
        cutVisits.forEach(v => { visitsByStatus[v.status] = (visitsByStatus[v.status] || 0) + 1; });

        const bookingsByAmenity = {};
        cutBookings.forEach(b => { bookingsByAmenity[b.amenity_name] = (bookingsByAmenity[b.amenity_name] || 0) + 1; });

        // Service charge breakdown — approximated from invoice source_type
        const chargeByCategory = {};
        cutInv.forEach(i => {
          const key = ({
            monthly_dues:     'Monthly Dues',
            amenity_booking:  'Amenity',
            service_request:  'Maintenance',
            manual:           'Other / Manual',
          })[i.source_type] || 'Other';
          chargeByCategory[key] = (chargeByCategory[key] || 0) + Number(i.amount_aed);
        });

        // ============ Monthly time-series (range from timeRange selector) ============
        const monthBuckets = buildMonthlyBuckets(monthCount);
        const monthIndex = Object.fromEntries(monthBuckets.map((m, i) => [m.key, i]));
        const pickKey = (s) => (s || '').slice(0, 7);
        const Z = () => new Array(monthCount).fill(0);

        const invSeries = { paid: Z(), pending: Z(), overdue: Z() };
        cutInv.forEach(inv => {
          const k = pickKey(inv.created_at || inv.due_date);
          const idx = monthIndex[k];
          if (idx == null) return;
          const amt = Number(inv.amount_aed) || 0;
          if (inv.status === 'Paid') invSeries.paid[idx] += amt;
          else if (inv.status === 'Pending') invSeries.pending[idx] += amt;
          else if (inv.status === 'Overdue') invSeries.overdue[idx] += amt;
        });

        // Cumulative collected vs invoiced (running total)
        let runCollected = 0, runInvoiced = 0;
        const cumCollected = invSeries.paid.map(v => { runCollected += v; return runCollected; });
        const cumInvoiced = invSeries.paid.map((p, i) => { runInvoiced += p + (invSeries.pending[i] || 0) + (invSeries.overdue[i] || 0); return runInvoiced; });

        const srSeries = { newAck: Z(), inProgress: Z(), done: Z() };
        cutSRs.forEach(s => {
          const idx = monthIndex[pickKey(s.created_at)];
          if (idx == null) return;
          if (s.status === 'New' || s.status === 'Acknowledged') srSeries.newAck[idx]++;
          else if (s.status === 'In Progress') srSeries.inProgress[idx]++;
          else if (s.status === 'Done' || s.status === 'Closed') srSeries.done[idx]++;
        });

        const visitsSeries = Z();
        cutVisits.forEach(v => {
          const idx = monthIndex[pickKey(v.visit_date || v.created_at)];
          if (idx != null) visitsSeries[idx]++;
        });

        const bookingsSeries = Z();
        cutBookings.forEach(b => {
          const idx = monthIndex[pickKey(b.booking_date || b.created_at)];
          if (idx != null) bookingsSeries[idx]++;
        });

        // Visitor type donut data (top 5)
        const visitTypeSorted = Object.entries(visitsByType).sort((a, b) => b[1] - a[1]).slice(0, 6);

        setStats({
          buildings: filterB ? (buildings || []).filter(b => filterB.includes(b.id)) : (buildings || []),
          totalUnits, occupiedUnits, vacant, occupancyRate, owners, tenants,
          monthlyRevenue, totalInvoiced, collected, pending, overdue, collectionRate,
          leasesExpSoon, leasesExpired,
          srByStatus, srByCategory, srByPriority, openSRs, closedSRs, totalSRs: (srs || []).length,
          visitsByType, visitsByStatus, totalVisits: (visits || []).length,
          bookingsByAmenity, totalBookings: (bookings || []).length,
          chargeByCategory,
          // Net Operating Income approximation (collected minus stub 30% operating cost)
          noi: Math.round(collected - 0.3 * collected),
          // Time-series
          monthLabels: monthBuckets.map(m => m.label),
          invSeries, srSeries, visitsSeries, bookingsSeries,
          cumCollected, cumInvoiced,
          visitTypeSorted,
          // Counts (after time-range filter)
          filteredInvoiceCount: cutInv.length,
          filteredSRCount: cutSRs.length,
          filteredVisitCount: cutVisits.length,
          filteredBookingCount: cutBookings.length,
        });
        setLoading(false);
      } catch (e) {
        if (mounted) { setError(String(e.message || e)); setLoading(false); }
      }
    })();
    return () => { mounted = false; };
  }, [selectedProperties.join(','), timeRange]);

  const fmt = (n) => 'AED ' + Math.round(n).toLocaleString();
  const fmtShort = (n) => {
    if (n >= 1_000_000) return 'AED ' + (n/1_000_000).toFixed(2) + 'M';
    if (n >= 1_000)     return 'AED ' + (n/1_000).toFixed(1) + 'K';
    return 'AED ' + Math.round(n);
  };

  const sections = [
    { id: 'finance',    label: 'Finance & Revenue' },
    { id: 'occupancy',  label: 'Occupancy & Leasing' },
    { id: 'operations', label: 'Operations' },
    { id: 'compliance', label: 'Compliance' },
  ];

  const downloadBlob = (filename, content, mime) => {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const handleExport = (format) => {
    setShowExport(false);
    if (!stats) { alert('Data is still loading — try again in a moment.'); return; }
    const today = new Date().toISOString().slice(0, 10);
    const filename = 'vars-pm-report-' + today;
    const scope = selectedProperties.length > 0 ? selectedProperties.length + ' building(s) — top-bar scope' : 'All buildings';

    const fmtA = (n) => 'AED ' + Math.round(n).toLocaleString();

    // Section definitions: [title, headerRow, dataRows]
    const sections = [
      ['Portfolio Health Summary', ['Metric','Value'], [
        ['Occupancy Rate', stats.occupancyRate + '%'],
        ['Occupied Units', stats.occupiedUnits + ' / ' + stats.totalUnits],
        ['Owners', stats.owners], ['Tenants', stats.tenants],
        ['Monthly Run-Rate', fmtA(stats.monthlyRevenue)],
        ['Open Maintenance', stats.openSRs],
        ['Outstanding Receivables', fmtA(stats.pending + stats.overdue)],
        ['Estimated Net Operating Income', fmtA(stats.noi)],
      ]],
      ['Rent Collection Status', ['Bucket','Amount (AED)','% of Total'], [
        ['Paid',    fmtA(stats.collected), (stats.totalInvoiced > 0 ? Math.round(stats.collected/stats.totalInvoiced*100) : 0) + '%'],
        ['Pending', fmtA(stats.pending),   (stats.totalInvoiced > 0 ? Math.round(stats.pending/stats.totalInvoiced*100)   : 0) + '%'],
        ['Overdue', fmtA(stats.overdue),   (stats.totalInvoiced > 0 ? Math.round(stats.overdue/stats.totalInvoiced*100)   : 0) + '%'],
        ['Total Invoiced', fmtA(stats.totalInvoiced), '100%'],
        ['Collection Rate', stats.collectionRate + '%', ''],
      ]],
      ['Service Charges by Source', ['Source','Amount (AED)'],
        Object.entries(stats.chargeByCategory || {}).map(([k, v]) => [k, fmtA(v)])
      ],
      ['Lease Pipeline', ['Bucket','Count'], [
        ['Expiring next 90 days', stats.leasesExpSoon],
        ['Already expired (holdover)', stats.leasesExpired],
      ]],
      ['Maintenance — Tickets by Status', ['Status','Count'],
        Object.entries(stats.srByStatus || {}).map(([k, v]) => [k, v])
      ],
      ['Maintenance — Tickets by Category', ['Category','Count'],
        Object.entries(stats.srByCategory || {}).map(([k, v]) => [k, v])
      ],
      ['Visitor Analytics — by Status', ['Status','Count'],
        Object.entries(stats.visitsByStatus || {}).map(([k, v]) => [k, v])
      ],
      ['Visitor Analytics — by Type', ['Type','Count'],
        Object.entries(stats.visitsByType || {}).map(([k, v]) => [k, v])
      ],
      ['Amenity Usage', ['Amenity','Bookings'],
        Object.entries(stats.bookingsByAmenity || {}).map(([k, v]) => [k, v])
      ],
      ['PMC Performance Scorecard', ['Metric','Value'], [
        ['Maintenance resolution rate', (stats.totalSRs > 0 ? Math.round(stats.closedSRs/stats.totalSRs*100) : 0) + '%'],
        ['Collection efficiency', stats.collectionRate + '%'],
        ['Open ticket ratio', (stats.totalSRs > 0 ? Math.round(stats.openSRs/stats.totalSRs*100) : 0) + '%'],
        ['Receivables ratio (outstanding / total)', (stats.totalInvoiced > 0 ? Math.round((stats.pending+stats.overdue)/stats.totalInvoiced*100) : 0) + '%'],
      ]],
    ];

    if (format === 'CSV') {
      const escape = (c) => { const s = String(c == null ? '' : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      let csv = 'VARS — PM Report\nGenerated,' + today + '\nScope,' + scope + '\n\n';
      sections.forEach(([title, head, rows]) => {
        csv += title + '\n';
        csv += [head, ...rows].map(r => r.map(escape).join(',')).join('\n');
        csv += '\n\n';
      });
      downloadBlob(filename + '.csv', csv, 'text/csv;charset=utf-8');
      return;
    }

    if (format === 'Excel') {
      const wb = window.XLSX.utils.book_new();
      // Summary sheet — everything in one tab
      const summary = [
        ['VARS — Property Manager Report'],
        ['Generated', today], ['Scope', scope], [],
      ];
      sections.forEach(([title, head, rows]) => {
        summary.push([title]);
        summary.push(head);
        rows.forEach(r => summary.push(r));
        summary.push([]);
      });
      window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(summary), 'Summary');
      // One sheet per section for analysts who want to pivot
      sections.forEach(([title, head, rows]) => {
        const safe = title.replace(/[^A-Za-z0-9 ]/g, '').slice(0, 28) || 'Section';
        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet([head, ...rows]), safe);
      });
      window.XLSX.writeFile(wb, filename + '.xlsx');
      return;
    }

    if (format === 'PDF') {
      const { jsPDF } = window.jspdf || {};
      if (!jsPDF) { alert('PDF library failed to load.'); return; }
      const doc = new jsPDF();
      doc.setFontSize(18); doc.setTextColor(26, 26, 26);
      doc.text('VARS — Property Manager Report', 14, 18);
      doc.setFontSize(10); doc.setTextColor(120, 120, 120);
      doc.text('Generated ' + today + ' · Scope: ' + scope, 14, 25);
      let y = 32;
      sections.forEach(([title, head, rows]) => {
        if (y > 250) { doc.addPage(); y = 20; }
        doc.setFontSize(12); doc.setTextColor(26, 26, 26);
        doc.text(title, 14, y);
        doc.autoTable({
          startY: y + 3,
          head: [head], body: rows.length ? rows : [['—','—']],
          theme: 'grid',
          headStyles: { fillColor: [146, 137, 137], textColor: 255, fontSize: 9 },
          bodyStyles: { fontSize: 9, textColor: 30 },
          margin: { left: 14, right: 14 },
        });
        y = (doc.lastAutoTable.finalY || y) + 12;
      });
      doc.save(filename + '.pdf');
      return;
    }

    if (format === 'Word') {
      let html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>VARS PM Report</title>';
      html += '<style>body{font-family:"Segoe UI",Arial,sans-serif;color:#1a1a1a;padding:24pt;}h1{font-size:20pt;margin:0 0 8pt;}h2{font-size:13pt;margin:18pt 0 6pt;color:#6b5d52;border-bottom:1px solid #d5cfc8;padding-bottom:4pt;}table{border-collapse:collapse;width:100%;margin:6pt 0 12pt;}th,td{border:1px solid #d5cfc8;padding:6pt 10pt;text-align:left;font-size:10pt;}th{background:#928989;color:#fff;}</style>';
      html += '</head><body>';
      html += '<h1>VARS — Property Manager Report</h1>';
      html += '<p style="color:#6b5d52;font-size:10pt;">Generated ' + today + ' · Scope: ' + scope + '</p>';
      sections.forEach(([title, head, rows]) => {
        html += '<h2>' + title + '</h2><table>';
        html += '<thead><tr>' + head.map(c => '<th>' + (c == null ? '' : c) + '</th>').join('') + '</tr></thead>';
        html += '<tbody>' + (rows.length ? rows : [['—','—']]).map(r => '<tr>' + r.map(c => '<td>' + (c == null ? '' : c) + '</td>').join('') + '</tr>').join('') + '</tbody>';
        html += '</table>';
      });
      html += '</body></html>';
      downloadBlob(filename + '.doc', html, 'application/msword');
      return;
    }
  };

  if (error) return <div className="page-header"><h1>Reports</h1><div style={{color:'#8b4a42',fontSize:13,marginTop:14}}>{error}</div></div>;

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Reports</h1>
          <div className="subtitle">Landlord-grade reporting. Live data from Supabase{selectedProperties.length > 0 ? ', scoped to your property selector at the top.' : '.'}</div>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <select className="form-input" value={timeRange} onChange={e => setTimeRange(e.target.value)} style={{width:'auto',minWidth:170,padding:'9px 14px',fontSize:13}}>
            <option value="3m">Last 3 months</option>
            <option value="6m">Last 6 months</option>
            <option value="12m">Last 12 months</option>
            <option value="24m">Last 24 months</option>
            <option value="ytd">Year to date</option>
            <option value="all">All time</option>
          </select>
        <div style={{position:'relative'}}>
          <button className="btn btn-primary" onClick={() => setShowExport(!showExport)}>Export ▾</button>
          {showExport && (
            <>
              <div onClick={() => setShowExport(false)} style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:899}}/>
              <div style={{position:'absolute',right:0,top:'100%',marginTop:6,minWidth:220,background:'#fff',border:'1px solid var(--border-light)',borderRadius:8,boxShadow:'0 8px 24px rgba(0,0,0,0.1)',zIndex:900,overflow:'hidden'}}>
                {['PDF','Word','CSV','Excel'].map(f => (
                  <div key={f} onClick={() => handleExport(f)} style={{padding:'12px 16px',cursor:'pointer',fontSize:13,borderBottom:'1px solid var(--border-light)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--bg-page)'} onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
                    Export as {f}
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
        </div>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:24,borderBottom:'1px solid var(--border-light)'}}>
        {sections.map(s => (
          <div key={s.id} onClick={() => setSection(s.id)} style={{padding:'10px 18px',cursor:'pointer',fontSize:13,fontWeight:section===s.id?500:400,color:section===s.id?'var(--text-dark)':'var(--text-secondary)',borderBottom: section===s.id ? '2px solid var(--bg-warm-dark)' : '2px solid transparent',marginBottom:-1,letterSpacing:'-0.01em'}}>
            {s.label}
          </div>
        ))}
      </div>

      {loading || !stats ? (
        <div className="card"><div style={{padding:24,color:'var(--text-muted)',fontSize:13}}>Loading…</div></div>
      ) : section === 'finance' ? <FinanceReports stats={stats} fmt={fmt} fmtShort={fmtShort}/> :
          section === 'occupancy' ? <OccupancyReports stats={stats} fmt={fmt}/> :
          section === 'operations' ? <OperationsReports stats={stats}/> :
          <ComplianceReports stats={stats}/>}
    </div>
  );
};

const FinanceReports = ({ stats, fmt, fmtShort }) => {
  const collectionPctOf = (key) => {
    const t = stats.totalInvoiced || 1;
    return Math.round(((stats[key] || 0) / t) * 100);
  };
  return (
    <div>
      {/* 1. Hero KPI strip */}
      <div className="card">
        <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Portfolio Health Summary</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(160px, 1fr))',gap:14}}>
          {[
            { label: 'Occupancy Rate', value: stats.occupancyRate + '%' },
            { label: 'Monthly Revenue (run-rate)', value: fmtShort(stats.monthlyRevenue) },
            { label: 'Collection Rate', value: stats.collectionRate + '%' },
            { label: 'Outstanding Receivables', value: fmtShort(stats.pending + stats.overdue) },
            { label: 'Open Maintenance', value: stats.openSRs },
            { label: 'Net Operating Income (est.)', value: fmtShort(stats.noi) },
          ].map((k, i) => (
            <div key={i} style={{padding:'18px 16px',background:'var(--bg-surface)',borderRadius:10,border:'1px solid var(--border-light)'}}>
              <div style={{fontSize:10,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--text-secondary)',marginBottom:6}}>{k.label}</div>
              <div style={{fontSize:26,fontWeight:600,color:'var(--text-dark)',letterSpacing:'-0.03em'}}>{k.value}</div>
            </div>
          ))}
        </div>
      </div>

      {/* 3. Rent Collection Status */}
      <div className="card">
        <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>Rent Collection Status</div>
        <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:14}}>Live breakdown of all invoices across selected properties</div>
        <div style={{display:'flex',height:32,borderRadius:6,overflow:'hidden',border:'1px solid var(--border-light)',marginBottom:14}}>
          <div title={'Paid: ' + fmt(stats.collected)} style={{flex: Math.max(stats.collected, 1), background:'#5a6b4f',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,fontWeight:500}}>
            {collectionPctOf('collected') > 8 ? collectionPctOf('collected') + '%' : ''}
          </div>
          <div title={'Pending: ' + fmt(stats.pending)} style={{flex: Math.max(stats.pending, 1), background:'#c4b8b0',display:'flex',alignItems:'center',justifyContent:'center',color:'#4a4540',fontSize:11,fontWeight:500}}>
            {collectionPctOf('pending') > 8 ? collectionPctOf('pending') + '%' : ''}
          </div>
          <div title={'Overdue: ' + fmt(stats.overdue)} style={{flex: Math.max(stats.overdue, 1), background:'#8b4a42',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,fontWeight:500}}>
            {collectionPctOf('overdue') > 8 ? collectionPctOf('overdue') + '%' : ''}
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(160px, 1fr))',gap:12,fontSize:12}}>
          <div><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#5a6b4f',marginRight:6}}/>Paid <strong>{fmt(stats.collected)}</strong></div>
          <div><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#c4b8b0',marginRight:6}}/>Pending <strong>{fmt(stats.pending)}</strong></div>
          <div><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#8b4a42',marginRight:6}}/>Overdue <strong>{fmt(stats.overdue)}</strong></div>
          <div><span style={{color:'var(--text-secondary)'}}>Total invoiced</span> <strong>{fmt(stats.totalInvoiced)}</strong></div>
        </div>
      </div>

      {/* 5. Service Charges Breakdown */}
      <div className="card">
        <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Service Charges Breakdown (by source)</div>
        {Object.keys(stats.chargeByCategory).length === 0 ? (
          <div style={{color:'var(--text-muted)',fontSize:13,padding:20}}>No charge data yet.</div>
        ) : (
          <div>
            {Object.entries(stats.chargeByCategory).sort((a,b) => b[1]-a[1]).map(([cat, amt]) => {
              const pct = stats.totalInvoiced > 0 ? Math.round((amt / stats.totalInvoiced) * 100) : 0;
              return (
                <div key={cat} style={{marginBottom:10}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                    <span style={{fontWeight:500}}>{cat}</span>
                    <span style={{color:'var(--text-secondary)'}}>{fmt(amt)} · {pct}%</span>
                  </div>
                  <div style={{height:6,background:'var(--bg-surface)',borderRadius:3,overflow:'hidden'}}>
                    <div style={{height:'100%',width:pct+'%',background:'var(--bg-warm-dark)'}}/>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Side-by-side: Invoice Status (stacked bar) + Cumulative Revenue (line) */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(440px, 1fr))',gap:18}}>
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
          <div>
            <div style={{fontSize:13,fontWeight:600}}>Invoice Status by Month</div>
            <div style={{fontSize:11,color:'var(--text-secondary)',marginTop:2}}>Stacked by Paid · Pending · Overdue. Hover bars for exact AED.</div>
          </div>
        </div>
        <ChartCanvas height={300} config={{
          type: 'bar',
          data: {
            labels: stats.monthLabels,
            datasets: [
              { label: 'Paid',    data: stats.invSeries.paid,    backgroundColor: '#5a6b4f' },
              { label: 'Pending', data: stats.invSeries.pending, backgroundColor: '#c4b8b0' },
              { label: 'Overdue', data: stats.invSeries.overdue, backgroundColor: '#8b4a42' },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
              tooltip: {
                callbacks: {
                  label: (ctx) => ctx.dataset.label + ': AED ' + Math.round(ctx.parsed.y).toLocaleString(),
                  footer: (items) => 'Total: AED ' + items.reduce((s, it) => s + it.parsed.y, 0).toLocaleString(),
                },
              },
            },
            scales: {
              x: { stacked: true, grid: { display: false } },
              y: { stacked: true, beginAtZero: true, ticks: { callback: (v) => 'AED ' + Math.round(v/1000) + 'K' } },
            },
          },
        }}/>
      </div>

      <div className="card">
        <div style={{marginBottom:6}}>
          <div style={{fontSize:13,fontWeight:600}}>Cumulative Revenue</div>
          <div style={{fontSize:11,color:'var(--text-secondary)',marginTop:2}}>Running total of collected vs invoiced over the period.</div>
        </div>
        <ChartCanvas height={300} config={{
          type: 'line',
          data: {

<script type="text/babel">
// ==================== PMC VISITORS PAGE ====================
// New: reads from the public.visits table (filterable), replaces the legacy blank page.

const PMCVisitorsPage = () => {
  const { selectedProperties = [] } = useApp();
  const [visits, setVisits] = useState(null);
  const [error, setError] = useState(null);
  const [buildings, setBuildings] = useState([]);
  const [statusFilter, setStatusFilter] = useState('all');
  const [typeFilter, setTypeFilter] = useState('all');
  const [dateFromFilter, setDateFromFilter] = useState('');
  const [dateToFilter, setDateToFilter] = useState('');
  const [search, setSearch] = useState('');

  const load = async () => {
    setError(null);
    if (!supabaseClient) return;
    const { data: vs, error: e1 } = await supabaseClient.from('visits')
      .select('id,unit_id,type,visitor_name,visitor_phone,visit_date,visit_time,status,permit_ref,purpose,vehicle,created_at')
      .order('visit_date', { ascending: false });
    if (e1) { setError(e1.message); setVisits([]); return; }
    const unitIds = [...new Set((vs || []).map(v => v.unit_id))];
    let units = [];
    if (unitIds.length) {
      const { data: us } = await supabaseClient.from('units').select('id,unit_number,floor,building_id').in('id', unitIds);
      units = us || [];
    }
    const buildingIds = [...new Set(units.map(u => u.building_id))];
    let bs = [];
    if (buildingIds.length) {
      const { data: bres } = await supabaseClient.from('buildings').select('id,name').in('id', buildingIds);
      bs = bres || [];
    }
    setBuildings(bs);
    const uMap = Object.fromEntries(units.map(u => [u.id, u]));
    const bMap = Object.fromEntries(bs.map(b => [b.id, b]));
    setVisits((vs || []).map(v => {
      const u = uMap[v.unit_id];
      return {
        ...v,
        unit_number: u ? u.unit_number : '—',
        floor: u ? u.floor : null,
        building_id: u ? u.building_id : null,
        building_name: u && bMap[u.building_id] ? bMap[u.building_id].name : '—',
      };
    }));
  };
  useEffect(() => { load(); }, []);

  const filtered = (visits || []).filter(v => {
    if (selectedProperties.length > 0 && !selectedProperties.includes(v.building_id)) return false;
    if (statusFilter !== 'all' && v.status !== statusFilter) return false;
    if (typeFilter !== 'all' && v.type !== typeFilter) return false;
    if (dateFromFilter && v.visit_date < dateFromFilter) return false;
    if (dateToFilter && v.visit_date > dateToFilter) return false;
    if (search) {
      const q = search.toLowerCase();
      const hay = (v.visitor_name + ' ' + (v.visitor_phone || '') + ' ' + v.unit_number + ' ' + (v.permit_ref || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const today = new Date().toISOString().slice(0, 10);
  const counts = {
    total: filtered.length,
    today: filtered.filter(v => v.visit_date === today).length,
    onPremise: filtered.filter(v => v.status === 'On-Premise').length,
    upcoming: filtered.filter(v => v.visit_date > today && v.status === 'Pre-Approved').length,
    checkedOut: filtered.filter(v => v.status === 'Checked-Out').length,
  };

  const statusBadge = (s) => {
    const c = ({
      'Pre-Approved': { bg: '#e8e3de', fg: '#4a4540' },
      'On-Premise':   { bg: '#928989', fg: '#fff' },
      'Checked-Out':  { bg: '#ccc8c1', fg: '#4a4540' },
      'No-Show':      { bg: '#f5f3f0', fg: '#a89a92' },
      'Rejected':     { bg: '#8b4a42', fg: '#fff' },
      'Cancelled':    { bg: '#f5f3f0', fg: '#a89a92' },
    })[s] || { bg: '#f5f3f0', fg: '#888' };
    return <span style={{padding:'3px 10px',borderRadius:4,fontSize:11,fontWeight:500,background:c.bg,color:c.fg}}>{s}</span>;
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Visitors</h1>
          <div className="subtitle">All visitor activity across managed buildings — past, today, and scheduled.</div>
        </div>
        <button className="btn btn-sm" onClick={load}>Refresh</button>
      </div>

      <div className="kpi-row">
        <div className="kpi-card"><div className="label">Total</div><div className="value">{counts.total}</div></div>
        <div className="kpi-card"><div className="label">Today</div><div className="value">{counts.today}</div></div>

// Replaces the legacy blank page. Reads security profiles + assignments from Supabase,
// computes on-duty status from current Dubai time + shift, exposes Chat/Report stubs.

const PMCGuardsPage = () => {
  const { selectedProperties = [] } = useApp();
  const [guards, setGuards] = useState(null);
  const [error, setError] = useState(null);
  const [buildings, setBuildings] = useState([]);
  const [shiftFilter, setShiftFilter] = useState('all');
  const [search, setSearch] = useState('');

  const load = async () => {
    setError(null);
    if (!supabaseClient) return;
    const { data: profs, error: e1 } = await supabaseClient.from('profiles').select('id,full_name,phone,created_at').eq('role','security').order('full_name');
    if (e1) { setError(e1.message); setGuards([]); return; }
    const ids = (profs || []).map(p => p.id);
    let assignments = [];
    if (ids.length) {
      const { data } = await supabaseClient.from('security_assignments').select('profile_id,building_id,shift').in('profile_id', ids);
      assignments = data || [];
    }
    const buildingIds = [...new Set(assignments.map(a => a.building_id))];
    let bs = [];
    if (buildingIds.length) {
      const { data } = await supabaseClient.from('buildings').select('id,name').in('id', buildingIds);
      bs = data || [];
    }
    setBuildings(bs);
    const buildingById = Object.fromEntries(bs.map(b => [b.id, b]));
    setGuards((profs || []).map(p => {
      const sa = assignments.find(a => a.profile_id === p.id);
      return {
        ...p,
        building_id: sa ? sa.building_id : null,
        building_name: sa && buildingById[sa.building_id] ? buildingById[sa.building_id].name : '—',
        shift: sa ? sa.shift : null,
      };
    }));
  };
  useEffect(() => { load(); }, []);

  // Asia/Dubai is UTC+4. On-duty schedule: Day 06–18, Night 18–06, 24h always.
  const isOnDuty = (shift) => {
    if (!shift) return false;
    if (shift === '24h') return true;
    const now = new Date();
    const dubaiHour = (now.getUTCHours() + 4) % 24;
    if (shift === 'Day')   return dubaiHour >= 6  && dubaiHour < 18;
    if (shift === 'Night') return dubaiHour >= 18 || dubaiHour < 6;
    return false;
  };

  const filtered = (guards || []).filter(g => {
    if (selectedProperties.length > 0 && !selectedProperties.includes(g.building_id)) return false;
    if (shiftFilter !== 'all' && g.shift !== shiftFilter) return false;
    if (search && !(g.full_name || '').toLowerCase().includes(search.toLowerCase()) && !(g.phone || '').includes(search)) return false;
    return true;
  });

  const onDutyCount = filtered.filter(g => isOnDuty(g.shift)).length;
  const offDutyCount = filtered.length - onDutyCount;

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Guards</h1>
          <div className="subtitle">Security staff across managed buildings — duty status, contact, and oversight actions.</div>
        </div>
        <button className="btn btn-sm" onClick={load}>Refresh</button>
      </div>

      <div className="kpi-row">
        <div className="kpi-card"><div className="label">Total Guards</div><div className="value">{filtered.length}</div></div>
        <div className="kpi-card"><div className="label">On Duty Now</div><div className="value" style={{color:'#5a6b4f'}}>{onDutyCount}</div></div>
        <div className="kpi-card"><div className="label">Off Duty</div><div className="value" style={{color:'#a89a92'}}>{offDutyCount}</div></div>
        <div className="kpi-card"><div className="label">Buildings Covered</div><div className="value">{new Set(filtered.map(g => g.building_id).filter(Boolean)).size}</div></div>
      </div>

      <div className="card">
        <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:14,padding:'8px 12px',background:'var(--bg-page)',borderRadius:6,border:'1px solid var(--border-light)'}}>
          {selectedProperties.length === 0
            ? 'Showing guards across all buildings. Use the property selector in the top bar to scope to specific buildings.'
            : selectedProperties.length === 1
              ? 'Scoped to 1 building (from the top-bar property selector).'
              : 'Scoped to ' + selectedProperties.length + ' buildings (from the top-bar property selector).'
          }
        </div>
        <div style={{display:'flex',gap:14,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{flex:'1 1 160px'}}>
            <label style={{fontSize:10,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--text-secondary)',marginBottom:6,display:'block',fontWeight:500}}>Shift</label>
            <select className="form-input" value={shiftFilter} onChange={e => setShiftFilter(e.target.value)}>
              <option value="all">All shifts</option>
              <option>Day</option><option>Night</option><option>24h</option>
            </select>
          </div>
          <div style={{flex:'2 1 200px'}}>
            <label style={{fontSize:10,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--text-secondary)',marginBottom:6,display:'block',fontWeight:500}}>Search</label>
            <input type="text" className="form-input" placeholder="Name or phone…" value={search} onChange={e => setSearch(e.target.value)}/>
          </div>
          <button className="btn btn-sm" onClick={() => { setShiftFilter('all'); setSearch(''); }}>Clear filters</button>
        </div>
      </div>

      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div style={{fontSize:12,color:'var(--text-secondary)'}}>{filtered.length} guard{filtered.length===1?'':'s'}</div>
        </div>
        {error && <div style={{padding:10,background:'#fdf2f1',color:'#8b4a42',borderRadius:6,fontSize:12,marginBottom:14}}>{error}</div>}
        {guards === null ? (

            <tbody>
              {filtered.map(g => {
